# ============================================================
# rapid-mlx + Ornith-1.5-9B-MLX-4bit — haiku 档轻量本地引擎
# 端口 8084 独立于生产(8081 Ornith-35B)。代理分流: haiku(force-local
# 数据保密) → 9B, sonnet/opus → 35B/云端。双引擎各自独立锁/并发, 真并行。
# 2026-08-29: haiku local_model=ornith-9b 指向本引擎。
# ============================================================

export HF_HUB_OFFLINE=1

LLAMA_BACKEND=rapid-mlx
LLAMA_MODEL="ornith-ai/Ornith-1.5-9B-MLX-4bit"
export MODEL_NAME="ornith-ai/Ornith-1.5-9B-MLX-4bit"
LLAMA_PORT=8084
LLAMA_HOST=127.0.0.1

# 9B hybrid(GatedDeltaNet, 32 层/interval 4): 权重 4.7GB, gpu-mem 0.22 → cap ~8GB
# (与 35B cap 28.1GB 共存: 合计 ~36GB < Metal wired 40GB)
RAPID_MLX_EXTRA_ARGS="--no-mllm --gpu-memory-utilization 0.22 --cache-memory-mb 2048 --max-num-seqs 1 --hybrid-cache-entries 8"
RAPID_MLX_ENABLE_PREFIX_CACHE=true
RAPID_MLX_KV_QUANTIZATION=true
RAPID_MLX_KV_QUANT_BITS=4

# 工具/推理解析器同 35B(qwen3 系)
RAPID_MLX_TOOL_PARSER="qwen3_coder_xml"
RAPID_MLX_REASONING_PARSER="qwen3"

CONFIG_NAME="rapid-mlx + Ornith-1.5-9B-MLX-4bit"
CONFIG_DESC="Ornith-1.5-9B(4.7GB): haiku 档轻量引擎, 独立 8084, 与 35B(8081) 共存分流"
CONFIG_MEMORY="~8 GB cap"