# ------------------------------------------------------------
# Inco Splash + Qwen3.6-35B-A3B — MoE+GDN hybrid（主力可切换档）
# 与 ornith-oq4e 同等地位: ./manage.sh switch splash-qwen36-35b && ./manage.sh restart
# 模型包: incoai/Qwen3.6-35B-A3B-Splash (20.9GB, 4bit + DFlash2 draft, Apache-2.0)
# 实测(2026-09-23, M5 Pro 48GB, 见 runbook §28.9):
#   散文 decode 117.0 tok/s / 代码 decode 264.8 / 热 TTFT 32K 0.10s / 冷 prefill 32K 3139 tok/s
# 注意: Splash 是单模型引擎——换模型需全停本引擎再启动另一个（含 serve-native 子进程）。
#       批期(实验批跑中)禁止切换（红线 1: 批内不动引擎）。
# ============================================================

export HF_HUB_OFFLINE=1

LLAMA_BACKEND=splash
LLAMA_MODEL="incoai/Qwen3.6-35B-A3B-Splash"
export MODEL_NAME="incoai/Qwen3.6-35B-A3B-Splash"
LLAMA_PORT=8081
LLAMA_HOST=127.0.0.1

# Splash 参数(唯二天花板; 无配置文件——engine built around the model):
#   --max-context 256K(2026-09-25: 100K→160K→256K 原生上限; Metal 余量待观察,
#     160K 探针后 pressure normal, 继续上探)
#   --default-reasoning-effort none 对齐我方 LLAMA_THINKING=false
#   KV 格式: 1.0.2 固定 int8(--kv-format bf16 未实现, README 领先实现)
#   认证默认关(本机环回); LAN 需 --api-key
SPLASH_EXTRA_ARGS="--max-context 256K --default-reasoning-effort none"
export SPLASH_EXTRA_ARGS

CONFIG_NAME="Splash + Qwen3.6-35B-A3B"
CONFIG_DESC="Inco Splash(DFlash2 内置) + Qwen3.6-35B-A3B(20.9GB): 散文 117/代码 264 tok/s, 热 TTFT 32K 0.10s, 与 ornith-oq4e 互斥切换"
CONFIG_MEMORY="~21 GB 模型 + KV（单引擎, 与 Ornith 不可同跑）"

# ============================================================
# 代理上下文管理参数（2026-09-23 自 ornith-oq4e 移植，选项 A）
# 背景: splash conf 原先只有引擎侧参数，代理侧全部回落 CONFIG_REGISTRY
# 默认 → epoch 引擎/视图稳定/PD 微轮召回全关，长会话保护缺失。
# 差异调整: PROXY_DYNAMIC_MAX_TOKENS_RAPID_MLX_RATIO 删（splash 非 rapid-mlx
# 采样路径）；其余与 ornith-oq4e 等值。
# ============================================================
export PROXY_COMPRESS_ENABLED=false              # 上下文工程引擎接管（同 ornith）
# R-CM-1/R-CM-2 跨会话记忆 + 自动交接（2026-10-09 自 splash-qwen38-27b 移植，
# 保持切模后 P0 不掉）：默认关的开关若不显式带，切 conf 即回落 false。
# L-80 L1 诚实计量(2026-10-09 随切模保活——env 级旗标不进 conf 会在重启时静默
# 回退 2.0 估算口径 k≈2.7; 见 swe-eval OBSERVATION-20261008-2330)
export PROXY_HONEST_METERING=1
export PROXY_MEMORY_ENABLED=true
export PROXY_HANDOFF_ENABLED=true
export PROXY_TOOL_FILTER_MAX=14
export PROXY_CHARS_GROWTH=80000
export PROXY_CHARS_EXPANSION=250000
export PROXY_CHARS_SATURATION=450000
export PROXY_CHARS_OOM_DANGER=2000000
export PROXY_OOM_SAFE_CHARS=2000000
export PROXY_OOM_SAFE_TOKENS=600000
# 请求体硬上限 8MB(2026-10-09): 入口闸必须 ≥ 自身生命周期层折算字节数, 否则
# 请求死在闸口, OOM_DANGER 的转云/截断根本没机会接管。
# 折算: PROXY_CHARS_OOM_DANGER=2M chars × 最坏 UTF-8 中文 3 bytes ≈ 6MB,
# 加余量取整 8388608。同时保留防呆(>1M tok 纯 ASCII 异常体仍被挡)。
# 云端闸(PROXY_CLOUD_MAX_REQUEST_BYTES=2MB)不动。
# 热生效: ./manage.sh reload(scope=reloadable, pipeline.py 按请求读取)。
export PROXY_MAX_REQUEST_BYTES=8388608
export PROXY_DYNAMIC_MAX_TOKENS_SATURATION=8192
export PROXY_DYNAMIC_MAX_TOKENS_OOM=4096
export PROXY_DYNAMIC_MAX_TOKENS_INIT=32768
export PROXY_DYNAMIC_MAX_TOKENS_GROWTH=32768
export PROXY_CTX_ENGINE_ENABLED=true
export PROXY_CTX_EPOCH_TRIGGER_TOKENS=70000
export PROXY_CTX_WINDOW_K=24
export PROXY_CTX_KEEP_TOKEN_BUDGET=40000
export PROXY_CTX_VIEW_STABLE_ENABLED="true"
export PROXY_ROUTE_ENABLED=true
export PROXY_ROUTE_THRESHOLD_CHARS=80000
export PROXY_ROUTE_STICKY=false
export PROXY_ROUTE_CLOUD_CONCURRENT=2
export PROXY_ROUTE_FALLBACK_ENABLED=true
export PROXY_ROUTE_MAX_CLOUD_FAILS=3
export PROXY_ROUTE_CLOUD_COOLDOWN_SECONDS=300
export PROXY_CLOUD_BASE_URL=https://api.deepseek.com/v1
export PROXY_CLOUD_MODEL=deepseek-flash
export PROXY_CLOUD_PRICE_INPUT=0.5
export PROXY_CLOUD_PRICE_OUTPUT=1.5
export PROXY_CLOUD_CM_ENABLED="false"
export PROXY_PD_MICRO_TURN_ENABLED=true
export PROXY_HBE_ENABLED=false
export PROXY_DIAG_SESSION_TTL_MIN=240
export PROXY_PIN_ENABLED="false"
