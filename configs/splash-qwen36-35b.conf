# ============================================================
# Inco Splash + Qwen3.6-35B-A3B — MoE+GDN hybrid（主力可切换档）
# 与 ornith-oq4e 同等地位: ./manage.sh switch splash-qwen36-35b && ./manage.sh restart
# 模型包: incoai/Qwen3.6-35B-A3B-Splash (20.9GB, 4bit + DFlash2 draft, Apache-2.0)
# 实测(2026-09-23, M5 Pro 48GB, 见 runbook §28.9):
#   散文 decode 117.0 tok/s / 代码 decode 264.8 / 热 TTFT 32K 0.10s / 冷 prefill 32K 3139 tok/s
# 注意: Splash 是单模型引擎——换模型需全停本引擎再启动另一个（含 serve-native 子进程）。
#       批期(实验批跑中)禁止切换（红线 1: 批内不动引擎）。
# ============================================================

export HF_HUB_OFFLINE=1

LLAMA_BACKEND=splash
LLAMA_MODEL="incoai/Qwen3.6-35B-A3B-Splash"
export MODEL_NAME="incoai/Qwen3.6-35B-A3B-Splash"
LLAMA_PORT=8081
LLAMA_HOST=127.0.0.1

# Splash 参数(唯二天花板; 无配置文件——engine built around the model):
#   --max-context 100K 与我方阶梯匹配(27B/35B 原生 256K 内存不够)
#   --default-reasoning-effort none 对齐我方 LLAMA_THINKING=false
#   KV 格式: 1.0.2 固定 int8(--kv-format bf16 未实现, README 领先实现)
#   认证默认关(本机环回); LAN 需 --api-key
SPLASH_EXTRA_ARGS="--max-context 100K --default-reasoning-effort none"
export SPLASH_EXTRA_ARGS

CONFIG_NAME="Splash + Qwen3.6-35B-A3B"
CONFIG_DESC="Inco Splash(DFlash2 内置) + Qwen3.6-35B-A3B(20.9GB): 散文 117/代码 264 tok/s, 热 TTFT 32K 0.10s, 与 ornith-oq4e 互斥切换"
CONFIG_MEMORY="~21 GB 模型 + KV（单引擎, 与 Ornith 不可同跑）"
