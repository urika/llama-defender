# ============================================================
# Inco Splash + Qwen3.8-27B — dense hybrid（备选/代码任务档）
# 与 ornith-oq4e 同等地位: ./manage.sh switch splash-qwen38-27b && ./manage.sh restart
# 模型包: incoai/Qwen3.8-27B-Splash (17.4GB, 4bit + DFlash2 draft)
# 实测(2026-09-23, M5 Pro 48GB, runbook §28.3/§28.8):
#   散文 decode 38.8 tok/s / 代码 decode 78.5-85.9（散文受 27B dense 带宽极限约束）
#   热 TTFT 32K 0.36s / 冷 prefill 32K 611 tok/s
# 适用: 代码任务为主(接受率红利 2-3.4x) 的场景; 长散文 agentic 选 splash-qwen36-35b 或 ornith。
# 注意: 单模型引擎, 换模型全停重启; 批期禁切换（红线 1）。
# ============================================================

export HF_HUB_OFFLINE=1

LLAMA_BACKEND=splash
LLAMA_MODEL="incoai/Qwen3.8-27B-Splash"
export MODEL_NAME="incoai/Qwen3.8-27B-Splash"
LLAMA_PORT=8081
LLAMA_HOST=127.0.0.1

SPLASH_EXTRA_ARGS="--max-context 100K --default-reasoning-effort none"
export SPLASH_EXTRA_ARGS

CONFIG_NAME="Splash + Qwen3.8-27B"
CONFIG_DESC="Inco Splash(DFlash2 内置) + Qwen3.8-27B(17.4GB): 代码任务 78-86 tok/s, 热 TTFT 32K 0.36s, 与 ornith-oq4e 互斥切换"
CONFIG_MEMORY="~18 GB 模型 + KV（单引擎, 与 Ornith 不可同跑）"
