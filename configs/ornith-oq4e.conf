# ============================================================
# rapid-mlx + Ornith-1.5-35B-A3B-MLX-4bit — DeepReinforce 自改进 MoE
# 模型: pyros-vault/Ornith-1.5-35B-A3B-oQ4e-fixed-mtp (19.5GB, MIT)
# 特点: 基于 Qwen3.5 架构(hybrid GatedDeltaNet + 稀疏 MoE, 256 专家/top-8)
#       bench 全面超 Qwen3.6-35B-A3B; 无 MTP/DFlash 投机解码(hybrid 门控关闭)
#       纯解码; prefix cache 需 --hybrid-cache-entries 8
# ============================================================

export HF_HUB_OFFLINE=1

LLAMA_BACKEND=rapid-mlx
LLAMA_MODEL="pyros-vault/Ornith-1.5-35B-A3B-oQ4e-fixed-mtp"
export MODEL_NAME="pyros-vault/Ornith-1.5-35B-A3B-oQ4e-fixed-mtp"  # 代理转发用别名，须与后端 /v1/models id 一致
LLAMA_PORT=8081
LLAMA_HOST=127.0.0.1
LLAMA_THREADS=8

# 采样（Ornith 官方推荐通用参数 temp=0.6, top_p=0.95, top_k=20）
LLAMA_TEMP=0.6
LLAMA_TOP_P=0.95
LLAMA_TOP_K=20
LLAMA_PRESENCE_PENALTY=0.0
LLAMA_MIN_P=0.0
LLAMA_THINKING=false

# 推理解析器 qwen3（Ornith 基于 Qwen3.5, 正确剥离 thinking 块）
RAPID_MLX_TOOL_PARSER="qwen3_coder_xml"
RAPID_MLX_REASONING_PARSER="qwen3"
RAPID_MLX_ENABLE_PREFIX_CACHE=true
RAPID_MLX_KV_QUANTIZATION=true
RAPID_MLX_KV_QUANT_BITS=4

# hybrid(GatedDeltaNet)必配 --hybrid-cache-entries 8(trim-free 前缀复用)
# 无投机解码(--force-spec-decode 对 hybrid 门控关闭, 无 Ornith drafter)
RAPID_MLX_EXTRA_ARGS="--no-mllm --gpu-memory-utilization 0.70 --cache-memory-mb 8192 --max-num-seqs 1 --default-repetition-penalty 1.05 --hybrid-cache-entries 8"

PROXY_MAX_CONCURRENT=1
# 优先级队列: 小请求(interactive <16K chars)优先于大请求, 解决长 haiku 生成
# 饿死小请求(2026-08-29 实测 0-0.5 tok/s 排队)。huge(≥350K chars)默认 action=cloud,
# 但 force-local 模型(haiku 数据保密)永不路由云端(local 承载或 413)。
PROXY_QUEUE_ENABLED=true
PROXY_CLEAR_ENABLED=false
PROXY_CLEAR_THRESHOLD=30000
PROXY_TOOL_KEEP=8
PROXY_CTX_LIMIT_ENABLED=true
PROXY_CTX_CHARS_LIMIT=400000
PROXY_CTX_KEEP_HEAD=6
PROXY_CTX_KEEP_TAIL=6
PROXY_CTX_TRUNCATE_STRATEGY=fifo
# 200 轮 agent 任务(每轮 ~3 消息);让 400K chars 上限成为实际约束
# (2026-08-26 冒烟实测: fifo 40 条=13 轮即截断, 模型持续失忆)
# 注意: 值不可带行内注释——reload_config 的行内注释剥离只对引号值生效,
# 未加引号的裸值会原样进 int() 致 ValueError, SIGHUP 直接打死代理进程
# (2026-08-26 实测: reload 时整进程崩溃重启)
PROXY_CTX_KEEP_MESSAGES=600
# === 生命周期阈值按 Ornith 实测容量重标定(2026-08-26 批跑 task1 实测) ===
# 事故链: session 续跑(≥2 请求)+ payload >90K chars(EXPANSION 默认值) →
# lifecycle 激进分支强制 saturation 配置(oom_safety=True) → OOM 墙
# (默认 200K chars) 在 est_chars=248,936 处触发 → 一次丢 53 条消息只留 12
# → 每轮窗口平移前缀全改写 → 前缀缓存击穿(ttft 2-15s → 93-113s/轮)
# + 模型失忆(丢 41 轮历史) + max_tokens 被砍到 2048(saturation 档)。
# 对照 bench: Ornith 160K tokens 冷 prefill 无 OOM、RSS 仅 19.5GB——
# 旧阈值是按 Qwen3.8-27B(82K tokens 即 28.8GB OOM)标定的, 对 Ornith 过紧。
# 新标定: fifo 400K chars 上限(≈100-130K tokens)为实际约束, OOM 墙/激进
# 分支退为纯兜底(est ≈ 2.75× payload, 2M chars 墙在 400K fifo 前不可达)。
export PROXY_CHARS_GROWTH=80000
export PROXY_CHARS_EXPANSION=250000
export PROXY_CHARS_SATURATION=450000
export PROXY_CHARS_OOM_DANGER=2000000
export PROXY_OOM_SAFE_CHARS=2000000
# OOM 迭代器第二道墙(pipeline OOM-safety: est_chars>OOM_DANGER 或 est_tokens>
# OOM_SAFE_TOKENS 即硬砍到 KEEP_HEAD+KEEP_TAIL=12 条)——默认 60000 在
# est_tokens≈110K(turn 36, payload 仅 90K chars)处触发, 与 chars 墙同为
# 失忆元凶。按 fifo 400K payload 最坏 est(est_tokens≈500K)留余量。
export PROXY_OOM_SAFE_TOKENS=600000
export PROXY_DYNAMIC_MAX_TOKENS_SATURATION=8192
export PROXY_DYNAMIC_MAX_TOKENS_OOM=4096
PROXY_MAX_TOKENS_OVERRIDE=0
PROXY_OUTPUT_TOKEN_LIMIT_RATIO=2.0
PROXY_BACKEND_TIMEOUT=600
# 循环检测阈值 7：Claude Code 在 Ansible/worktree 流程中连续多个 Bash(实测 max_run=6)
# 属合理序列，阈值 3 每轮误报 loop_l1(注入 warning 耗 token)；7 消除误报，真死循环仍由
# PROXY_LOOP_LEVEL3(默认 9)兜底删工具
PROXY_LOOP_THRESHOLD=7

# 上下文工程引擎关闭：hybrid prefix cache 依赖稳定前缀，epoch 重写会击穿缓存（同 dflash-35b）
export PROXY_CTX_ENGINE_ENABLED=false

# === #51-A1 齿尖预算标定（引擎重新启用时取消下面注释，配套 B1 心跳已常驻） ===
# 齿尖高度 ≈ S − L0（epoch 触发预算 − 锚定前缀）：分叉点后全部 tokens 需冷
# prefill。Ornith 长上下文 prefill ~450 tok/s → spike ≤ 50K ≈ 110-120s 安全
# （180s 客户端耐心线内，B1 心跳下更是双保险）。
# S 默认 70K → spike ≈ 58K ≈ 130-140s 贴线；标定 60K → spike ≈ 48K 留 30% 余量。
# L0 实测口径：claude-code system+tools 锚约 10-12K tokens。
# export PROXY_CTX_EPOCH_TRIGGER_TOKENS=60000
# K 维持默认 24（K 只影响 epoch 后保留的最近轮数，不影响齿尖高度）。
# export PROXY_CTX_WINDOW_K=24

CONFIG_NAME="rapid-mlx + Ornith-1.5-35B-A3B-oQ4e"
CONFIG_DESC="Ornith-1.5-35B-A3B-oQ4e-fixed-mtp(20.1GB, imatrix 混合精度): hybrid+MoE, 编码 bench 超 Qwen3.6-35B, 无投机解码, thinking off, hybrid-cache-entries 8, GPU=70%"
CONFIG_MEMORY="~16-20 GB"

# 请求体大小硬上限
PROXY_MAX_REQUEST_BYTES=2097152
PROXY_CLOUD_MAX_REQUEST_BYTES=2097152

# === 智能路由（可选，默认关闭） ===
export PROXY_ROUTE_ENABLED=true
export PROXY_ROUTE_THRESHOLD_CHARS=80000
export PROXY_CLOUD_BASE_URL=https://api.deepseek.com/v1
export PROXY_CLOUD_MODEL=deepseek-v4-flash
export PROXY_ROUTE_CLOUD_CONCURRENT=2
export PROXY_ROUTE_FALLBACK_ENABLED=true
export PROXY_ROUTE_MAX_CLOUD_FAILS=3
export PROXY_ROUTE_CLOUD_COOLDOWN_SECONDS=300
export PROXY_CLOUD_PRICE_INPUT=0.5
export PROXY_CLOUD_PRICE_OUTPUT=1.5

# 动态 max_tokens 上限
export PROXY_DYNAMIC_MAX_TOKENS_INIT=32768
export PROXY_DYNAMIC_MAX_TOKENS_GROWTH=32768
export PROXY_DYNAMIC_MAX_TOKENS_RAPID_MLX_RATIO=1.0