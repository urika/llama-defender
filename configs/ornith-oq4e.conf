# ============================================================
# rapid-mlx + Ornith-1.5-35B-A3B-MLX-4bit — DeepReinforce 自改进 MoE
# 模型: pyros-vault/Ornith-1.5-35B-A3B-oQ4e-fixed-mtp (19.5GB, MIT)
# 特点: 基于 Qwen3.5 架构(hybrid GatedDeltaNet + 稀疏 MoE, 256 专家/top-8)
#       bench 全面超 Qwen3.6-35B-A3B; 无 MTP/DFlash 投机解码(hybrid 门控关闭)
#       纯解码; prefix cache 需 --hybrid-cache-entries 32
# ============================================================

export HF_HUB_OFFLINE=1

LLAMA_BACKEND=rapid-mlx
LLAMA_MODEL="pyros-vault/Ornith-1.5-35B-A3B-oQ4e-fixed-mtp"
export MODEL_NAME="pyros-vault/Ornith-1.5-35B-A3B-oQ4e-fixed-mtp"  # 代理转发用别名，须与后端 /v1/models id 一致
LLAMA_PORT=8081
LLAMA_HOST=127.0.0.1
LLAMA_THREADS=8

# 采样（Ornith 官方推荐通用参数 temp=0.6, top_p=0.95, top_k=20）
LLAMA_TEMP=0.6
LLAMA_TOP_P=0.95
LLAMA_TOP_K=20
LLAMA_PRESENCE_PENALTY=0.0
LLAMA_MIN_P=0.0
LLAMA_THINKING=false

# 推理解析器 qwen3（Ornith 基于 Qwen3.5, 正确剥离 thinking 块）
RAPID_MLX_TOOL_PARSER="qwen3_coder_xml"
RAPID_MLX_REASONING_PARSER="qwen3"
RAPID_MLX_ENABLE_PREFIX_CACHE=true
RAPID_MLX_KV_QUANTIZATION=true
RAPID_MLX_KV_QUANT_BITS=4

# hybrid(GatedDeltaNet)必配 --hybrid-cache-entries 32(trim-free 前缀复用)
# 无投机解码(--force-spec-decode 对 hybrid 门控关闭, 无 Ornith drafter)
RAPID_MLX_EXTRA_ARGS="--no-mllm --gpu-memory-utilization 0.70 --cache-memory-mb 8192 --max-num-seqs 1 --default-repetition-penalty 1.0 --hybrid-cache-entries 32"

PROXY_MAX_CONCURRENT=1
# 优先级队列: 小请求(interactive <16K chars)优先于大请求, 解决长 haiku 生成
# 饿死小请求(2026-08-29 实测 0-0.5 tok/s 排队)。huge(≥350K chars)默认 action=cloud,
# 但 force-local 模型(haiku 数据保密)永不路由云端(local 承载或 413)。
PROXY_QUEUE_ENABLED=true
PROXY_CLEAR_ENABLED=false
PROXY_CLEAR_THRESHOLD=30000
# 语义压缩关闭(2026-08-29 循环根因): TokenSieve 把 tool_result 压到 ~15%,
# 模型读不到精确文件/表格内容 → 反复重读同一文件 → 死循环(max_run 爬升)。
# 本地模型 + agentic 文件工作流不需要激进压缩, 400K 截断已兜底上下文。
export PROXY_COMPRESS_ENABLED=false
PROXY_TOOL_KEEP=8
# 工具过滤：MAX 20→14（opencode 20 工具触发过滤，keep=recent 5 轮 + auto-promote
# ≥3 次 + always_keep；opencode 工具名小写与 always_keep 大写不匹配 → 实际按
# 近期使用集裁剪，剔除未用的 MCP 搜索工具，缩小决策空间 + 降低每轮 payload）
export PROXY_TOOL_FILTER_MAX=14
PROXY_CTX_LIMIT_ENABLED=true
PROXY_CTX_CHARS_LIMIT=400000
PROXY_CTX_KEEP_HEAD=6
PROXY_CTX_KEEP_TAIL=6
PROXY_CTX_TRUNCATE_STRATEGY=fifo
# 200 轮 agent 任务(每轮 ~3 消息);让 400K chars 上限成为实际约束
# (2026-08-26 冒烟实测: fifo 40 条=13 轮即截断, 模型持续失忆)
# 注意: 值不可带行内注释——reload_config 的行内注释剥离只对引号值生效,
# 未加引号的裸值会原样进 int() 致 ValueError, SIGHUP 直接打死代理进程
# (2026-08-26 实测: reload 时整进程崩溃重启)
PROXY_CTX_KEEP_MESSAGES=80
# === 生命周期阈值按 Ornith 实测容量重标定(2026-08-26 批跑 task1 实测) ===
# 事故链: session 续跑(≥2 请求)+ payload >90K chars(EXPANSION 默认值) →
# lifecycle 激进分支强制 saturation 配置(oom_safety=True) → OOM 墙
# (默认 200K chars) 在 est_chars=248,936 处触发 → 一次丢 53 条消息只留 12
# → 每轮窗口平移前缀全改写 → 前缀缓存击穿(ttft 2-15s → 93-113s/轮)
# + 模型失忆(丢 41 轮历史) + max_tokens 被砍到 2048(saturation 档)。
# 对照 bench: Ornith 160K tokens 冷 prefill 无 OOM、RSS 仅 19.5GB——
# 旧阈值是按 Qwen3.8-27B(82K tokens 即 28.8GB OOM)标定的, 对 Ornith 过紧。
# 新标定: fifo 400K chars 上限(≈100-130K tokens)为实际约束, OOM 墙/激进
# 分支退为纯兜底(est ≈ 2.75× payload, 2M chars 墙在 400K fifo 前不可达)。
export PROXY_CHARS_GROWTH=80000
export PROXY_CHARS_EXPANSION=250000
export PROXY_CHARS_SATURATION=450000
export PROXY_CHARS_OOM_DANGER=2000000
export PROXY_OOM_SAFE_CHARS=2000000
# OOM 迭代器第二道墙(pipeline OOM-safety: est_chars>OOM_DANGER 或 est_tokens>
# OOM_SAFE_TOKENS 即硬砍到 KEEP_HEAD+KEEP_TAIL=12 条)——默认 60000 在
# est_tokens≈110K(turn 36, payload 仅 90K chars)处触发, 与 chars 墙同为
# 失忆元凶。按 fifo 400K payload 最坏 est(est_tokens≈500K)留余量。
export PROXY_OOM_SAFE_TOKENS=600000
export PROXY_DYNAMIC_MAX_TOKENS_SATURATION=8192
export PROXY_DYNAMIC_MAX_TOKENS_OOM=4096
PROXY_MAX_TOKENS_OVERRIDE=0
PROXY_OUTPUT_TOKEN_LIMIT_RATIO=2.0
PROXY_BACKEND_TIMEOUT=600
# 循环检测阈值 7：Claude Code 在 Ansible/worktree 流程中连续多个 Bash(实测 max_run=6)
# 属合理序列，阈值 3 每轮误报 loop_l1(注入 warning 耗 token)；7 消除误报，真死循环仍由
# PROXY_LOOP_LEVEL3(默认 9)兜底删工具
PROXY_LOOP_THRESHOLD=7

# 上下文工程引擎（2026-09-03 生产启用）：
# 验证链 = 9B 门禁(e9d0959) → 35B 门禁(G1-G4 全过) → S 校准(00ea0a1) →
# entries=32 + gpu-mem 0.70(49e5475/5af8e02)。S=110000 = 真实 ~59K 触发
# （est×0.537 校准系数，窗口峰值实测 60,175 tokens），折叠间隔 ~62 轮，
# 全冷轮 2/80、命中 0.959。append-only canonical 把 fifo 每轮滑动失配
# 转为低频一次性 epoch 重置。
export PROXY_CTX_ENGINE_ENABLED=true
# 引擎折叠预算 70K（2026-09-06 定标）：成功 run 收敛上界 55K tokens 留 27%
# 余量；70K 视图的单次冷 prefill ~2.5 分钟可接受，Metal 压力显著低于 110K。
# chars 准入 400K(≈100K tok) > 70K，两把尺子口径一致（TC28 教训）。
# 注意: S 为 reloadable 热读——EXP recall-r2 批跑结束前勿 reload/restart，
# 否则 rep1(视图已 54K)会在 45 轮内触发首次折叠，污染 baseline 量测。
export PROXY_CTX_EPOCH_TRIGGER_TOKENS=70000
export PROXY_CTX_WINDOW_K=24

CONFIG_NAME="rapid-mlx + Ornith-1.5-35B-A3B-oQ4e"
CONFIG_DESC="Ornith-1.5-35B-A3B-oQ4e-fixed-mtp(20.1GB, imatrix 混合精度): hybrid+MoE, 编码 bench 超 Qwen3.6-35B, 无投机解码, thinking off, hybrid-cache-entries 32, ctx_engine on(S=110K), GPU=70%"
CONFIG_MEMORY="~16-20 GB"

# 请求体大小硬上限
PROXY_MAX_REQUEST_BYTES=2097152
PROXY_CLOUD_MAX_REQUEST_BYTES=2097152

# === 智能路由（可选，默认关闭） ===
export PROXY_ROUTE_ENABLED=true
export PROXY_ROUTE_THRESHOLD_CHARS=80000
# sticky 关闭(2026-08-30): 会话入云后上下文回落<阈值连续 5 轮即回本地,
# 实现 sonnet 等模型"短本地/长云端"动态切换, 避免会话永久粘云
export PROXY_ROUTE_STICKY=false
export PROXY_CLOUD_BASE_URL=https://api.deepseek.com/v1
export PROXY_CLOUD_MODEL=deepseek-v4-flash
export PROXY_ROUTE_CLOUD_CONCURRENT=2
export PROXY_ROUTE_FALLBACK_ENABLED=true
export PROXY_ROUTE_MAX_CLOUD_FAILS=3
export PROXY_ROUTE_CLOUD_COOLDOWN_SECONDS=300
export PROXY_CLOUD_PRICE_INPUT=0.5
export PROXY_CLOUD_PRICE_OUTPUT=1.5

# 动态 max_tokens 上限
export PROXY_DYNAMIC_MAX_TOKENS_INIT=32768
export PROXY_DYNAMIC_MAX_TOKENS_GROWTH=32768
export PROXY_DYNAMIC_MAX_TOKENS_RAPID_MLX_RATIO=1.0

# === H_BE shadow 探针（hbe_probe.py，2026-08-29，只测不动） ===
# 成功的本地响应后搭 prefix cache 便车做一次双探针锚定提问，top_logprobs
# 截断熵落盘 logs/diag/hbe.jsonl；不改变任何路由/截断/压缩决策。
# 引擎锁等待超 PROXY_HBE_LOCK_WAIT_S(默认 5s)自动放弃，零用户可感延迟。
# 仅本地路径触发（上下文不出本机）；fail-open，任何失败静默跳过。
# SAMPLE_EVERY=1 为开模期标定档（每轮都测）；验证完应调回 4 降开销。
# 2026-08-30 调回 4：首日标定 319 条/30 会话已够起步，p50 34s 探针
# 占用引擎锁是真实用户延迟；斜率估计每 4 轮一采样足够。
# 注意必须 export：裸赋值不进启动环境（defaults.sh 只写注册表默认值），
# 只有 SIGHUP reload 才会解析裸值。
export PROXY_HBE_ENABLED=true
export PROXY_HBE_SAMPLE_EVERY=2
export PROXY_HBE_MIN_CHARS=8000

# === PDC 微轮重派（2026-09-01 收尾开启，commit 258d414）===
# exp-2-v2 证实 ctx_recall 零调用（欠拉），L1-L3 指引注入 + 微轮自答
# （同请求内自答 ctx_recall 并重派，客户端透明）组成治疗臂；
# 配对 A/B 以 v2 批（旧代码）为对照臂。 conf_hash 以
# PROXY_DIAG_SESSION_TTL_MIN 180→240 为分界标记。
export PROXY_PD_MICRO_TURN_ENABLED=true
export PROXY_DIAG_SESSION_TTL_MIN=240

# === R19 pin 头 live smoke（临时开启，验证后恢复默认 false）===
export PROXY_PIN_ENABLED="false"

# === ctx_recall 自闭环 auto-recall（2026-09-05 设计，默认关）===
# EXP-2 实验臂开关：arm_baseline=false / arm_auto_recall=true，
# 臂间切换改本行后 ./manage.sh reload（阈值/上限见 proxy_config CONFIG_REGISTRY）
# 2026-09-06 23:16 EXP-2R 收官纪律: 双臂跑毕回默认关(双关)
export PROXY_AUTO_RECALL_ENABLED="false"
export PROXY_TOMBSTONE_RECALL_ENABLED="false"

# === DEF-308 轨道①：发送视图字节稳定化（2026-09-06，默认关）===
# engine absorb 跳过/剥离已应答 exchange 的客户端改写副本（SDK 墓碑化），
# 视图只增不缩 → 后端 hybrid 整条匹配保持命中，消除每轮 46K 全额冷 prefill。
# EXP-2R 批后与 probe_prefix_cache.py 实验一起开启验证。
export PROXY_CTX_VIEW_STABLE_ENABLED="false"

# === DEF-310：aux 隔离强化（2026-09-06，默认关）===
# tools=0 即分域（不限 haiku tier）：WebSearch 子请求的 154B 短系统+指令型
# 污染曾漏网进主 canonical（EXP-2R seq4 实证）。EXP-2R 批后开启。
export PROXY_AUX_ISOLATION_STRICT="false"

# === EXP-3 前置③：云端上下文管理（2026-09-06，默认关/按臂开）===
# 云端路由交代理管理（engine 写入期压缩+召回），长会话省输入 token。
# 按模型/按请求覆盖：models.json context_managed_by / X-Proxy-Context-Managed-By。
# 注意：EXP-2R 批后再开（当前 false=云端透传旧行为，批次公平性）。
export PROXY_CLOUD_CM_ENABLED="false"

# P1a LCP snap-down（llama-defender 上下文工程 §11，2026-09-06）
# 多边界线性态检查点：生产侧 N 段 prefill 捕获 + fetch 侧降档复用。
# Gate A 通过后保持开启；出问题回退=删本行 + restart-backend。
export PROXY_CACHE_LCP_SNAPDOWN=1
