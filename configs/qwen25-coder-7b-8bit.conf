# ============================================================
# rapid-mlx + Qwen2.5-Coder-7B-Instruct-8bit — IDE 代码补全专用
# 端口 8083 独立于生产(8081 Ornith / 4000 代理), 补全流量直连本端口,
# 不经 llama-defender(代理 MAX_CONCURRENT=1 会把补全排队到 agentic 之后;
# 代理的截断/压缩管线对 FIM 请求也无意义)。
#
# 选型与验证(2026-08-27 实测):
#   - FIM 三连(单行填充/中段编辑/裸前缀)全过, 中段题与 Qwen3-Coder-30B
#     逐字符一致; 补全档热 TTFT 0.07s, 冷(440tok) 1.97s
#   - ⚠️ 4bit 版 checkpoint 损坏(FIM 出 "lo lo lo"、chat 答非所问;
#     同机同栈 8bit 完好互证), 已删缓存, 勿再下 4bit
#   - Qwen3-Coder 家族无 8B 档; 本机 Qwen3-8B-4bit FIM 不合格(instruct
#     对齐压掉填充能力)
#
# FIM 调用要点(客户端配置):
#   prompt = "<|fim_prefix|>{光标前文}<|fim_suffix|>{光标后文}<|fim_middle|>"
#   stop   = ["<|fim_end|>", "<|endoftext|>"]
#   端点   = POST http://127.0.0.1:8083/v1/completions
#
# 共存边界: 与 Ornith(19.5GB 稳态)共存合计 ~30GB, 48GB 机器宽裕;
# 但 Ornith 批跑前必须停本服务(批跑 KV 可涨至 27GB+, 叠加贴物理上限,
# swap 挤兑事故形态见 docs 2026-08-22 节)。
# ============================================================

export HF_HUB_OFFLINE=1

LLAMA_BACKEND=rapid-mlx
LLAMA_MODEL="mlx-community/Qwen2.5-Coder-7B-Instruct-8bit"
export MODEL_NAME="mlx-community/Qwen2.5-Coder-7B-Instruct-8bit"
LLAMA_PORT=8083
LLAMA_HOST=127.0.0.1

# 8bit dense 7B: 权重 8.5GB, gpu-mem 0.22 → cap ~10.6GB(权重+KV), 实测跑通
# (注意 rapid-mlx 的 D-METAL-CAP 准入检查: cap 必须大于权重, 否则全部 503)
RAPID_MLX_EXTRA_ARGS="--no-mllm --gpu-memory-utilization 0.22 --cache-memory-mb 1536 --max-num-seqs 1"

# 补全不需要工具/推理解析器与 thinking 开关(Qwen2.5 无思考模式)
RAPID_MLX_TOOL_PARSER=""
RAPID_MLX_REASONING_PARSER=""

# 前缀缓存必开: 编辑器同文件反复补全, 热 TTFT 0.07s 靠它
RAPID_MLX_ENABLE_PREFIX_CACHE=true

# KV 量化不开: 8bit 模型 KV 用 FP16 即可, 少一个变量(4bit KV 曾是退化
# 嫌疑之一, 排除后保守起见保持默认)
RAPID_MLX_KV_QUANTIZATION=false

CONFIG_NAME="rapid-mlx + Qwen2.5-Coder-7B-8bit (completion)"
CONFIG_DESC="Qwen2.5-Coder-7B-Instruct-8bit(8.5GB): IDE FIM 补全专用, 独立 8083, 与生产 Ornith 共存"
CONFIG_MEMORY="~10 GB cap"
