# ============================================================
# EmbeddingGemma 2 (Q8_0 GGUF) + llama-server —— 嵌入辅助引擎
#
# 端口 8083，独立于生产(8081)、MiniCPM5(8082)、9B(8084)。
# 启停: ./manage.sh start-aux embedgemma2 / stop-aux embedgemma2
#       与主后端共存、互不影响（aux 引擎不进代理管线）。
#
# 模型: google/embeddinggemma-2 (Apache-2.0)。文本/图像/音频/视频映射到同一个
#       768 维空间，8192 token 上下文，Matryoshka 可截断到 512/256/128。
#   权重: downloads/embeddinggemma-win-offline/embeddinggemma-2-Q8_0.gguf (295.5 MiB)
#   多模态可选件: 同目录 mmproj-embeddinggemma-2-Q8_0.gguf (529 MiB)
#
# 引擎: 必须是能识别 gemma-embedding2 架构的 llama-server。brew 版太旧，会报
#       "unknown model architecture: 'gemma-embedding2'"。构建脚本:
#       bash downloads/eg2-bench/build_llamacpp.sh
#       成品已复制到 tools/bin/llama-server-eg2（见 .gitignore，不入库）。
#
# 实测 (M5 Pro / 纯 CPU / Q8_0): 就绪 4.05s，热单条 p50 14.6ms，
#       真实语料索引 12.4 块/s (≈3000 token/s)，docs/ 检索 768 维 R@1 0.208
#       领先 bge-m3(1024 维) 6.7pp；512 维不掉点、存储省 34%。
#       完整报告与原始数据: downloads/eg2-bench/实测报告.md
# ============================================================

# 纯离线：本地 GGUF，禁止任何 HF 访问
export HF_HUB_OFFLINE=1

LLAMA_BACKEND=llama-server
LLAMA_PORT=8083
LLAMA_HOST=127.0.0.1

# ---- 引擎二进制 ------------------------------------------------------------
# 覆盖: EMBEDGEMMA2_SERVER_BIN=/path/to/llama-server ./manage.sh start-aux embedgemma2
_EG2_ROOT="${SCRIPT_DIR:-/Users/jinsongwang/APP/llama.cpp}"
LLAMA_SERVER_BIN="${EMBEDGEMMA2_SERVER_BIN:-$_EG2_ROOT/tools/bin/llama-server-eg2}"
if [[ ! -x "$LLAMA_SERVER_BIN" ]]; then
    echo "⚠️  引擎二进制不存在或不可执行: $LLAMA_SERVER_BIN" >&2
    echo "   重建: bash $_EG2_ROOT/downloads/eg2-bench/build_llamacpp.sh" >&2
    echo "   （brew 版 llama-server 不识别 gemma-embedding2 架构，不能用）" >&2
fi

# ---- 模型 ------------------------------------------------------------------
LLAMA_MODEL="$_EG2_ROOT/downloads/embeddinggemma-win-offline/embeddinggemma-2-Q8_0.gguf"
export MODEL_NAME="embeddinggemma-2-Q8_0"
if [[ ! -f "$LLAMA_MODEL" ]]; then
    echo "⚠️  模型文件不存在: $LLAMA_MODEL" >&2
fi

# ---- 运行参数（都有实测依据，别随手改） ------------------------------------
# 8192: GGUF 元数据 context_length=262144 是 RoPE 上限，模型卡的有效窗口只有
#       8192。不显式写 -c 会按 262144 申请 KV（浪费内存且无意义）。
LLAMA_CTX=8192

# 4096/2048: 必须。manage.sh 默认 -b 2048 -ub 512，而 llama.cpp 会把 n_batch
#       压到 n_ubatch，于是超过 512 token 的文档一律 HTTP 500
#       （"input (635 tokens) is too large to process"）——这是本模型最大的坑。
LLAMA_BATCH=4096
LLAMA_UBATCH=2048

# 8 线程: 实测 600 字文档 -t 4 → 12.3 块/s、-t 8 → 17.8、-t 14 → 21.9（次线性，
#       内存带宽受限）。取 8 是把机器留给 8081 主引擎的折中；独占可提到物理核数。
LLAMA_THREADS=8

# f16: 只跑嵌入且上下文仅 8K，KV 缓存只有几 MB，量化没有收益，保持默认精度。
LLAMA_KV_K=f16
LLAMA_KV_V=f16

# 空 = 不注入 --chat-template-kwargs（嵌入模型没有 thinking 模式）
LLAMA_THINKING=""

# ---- 嵌入模式固有参数 ------------------------------------------------------
# --embeddings 打开 /v1/embeddings；--pooling mean 与 GGUF 元数据 pooling_type=1 一致。
# -ngl 0 = 纯 CPU：8081 主引擎已占约 20GB Metal 显存，嵌入模型走 CPU 既不抢
#   Metal 也不增加 OOM 风险，实测 14.6ms/条完全够用。要用 GPU 改成 -ngl 99。
# 多模态: EMBEDGEMMA2_MMPROJ=1 ./manage.sh start-aux embedgemma2 追加 --mmproj
#   （注意视频还要外挂 ffmpeg，且需显式 --video-fps 控制 token 预算）
LLAMA_EXTRA_ARGS="--embeddings --pooling mean -ngl 0"
if [[ "${EMBEDGEMMA2_MMPROJ:-0}" == "1" ]]; then
    LLAMA_EXTRA_ARGS+=" --mmproj $_EG2_ROOT/downloads/embeddinggemma-win-offline/mmproj-embeddinggemma-2-Q8_0.gguf"
fi

# 就绪探针必须切到 /v1/embeddings：--embeddings 模式下 /v1/chat/completions
# 固定返回 500 "the current context does not support logits computation. skipping"，
# 沿用默认 chat 探针会永远等不到就绪（start-aux 会误报超时）。
LLAMA_EMBEDDING_PROBE=true

# 调用必须带密钥：引擎继承 manage.sh 环境里的 LLAMA_API_KEY（由
# configs/secret.local.conf 导出），llama-server 会强制校验，不带就是
# 401 "Invalid API Key"：
#   curl -H "Authorization: Bearer $LLAMA_API_KEY" \
#        -H 'Content-Type: application/json' \
#        -d '{"input":"要嵌入的文本"}' http://127.0.0.1:8083/v1/embeddings
# 就绪探针已相应改为带该头（manage.sh 的 _curl_engine）。

# 采样参数（LLAMA_TEMP/TOP_P/…）对嵌入无意义，manage.sh 仍会传给 llama-server，
# 引擎会忽略，无需在此覆盖。PROXY_* 变量对 aux 引擎无效，故不设置。

CONFIG_NAME="llama-server + EmbeddingGemma 2 Q8_0 (aux)"
CONFIG_DESC="EmbeddingGemma 2 Q8_0 (295MB 嵌入模型): 独立 8083, start-aux/stop-aux 独立启停, 与主后端共存; 768 维/8192 ctx/纯 CPU, 支持 Matryoshka 512"
CONFIG_MEMORY="~0.5 GB"
