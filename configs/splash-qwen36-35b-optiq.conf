#   S=150000 实际冷 prefill ≈130s，相对客户端 466s 断连死线仍有 3.5× 余量
#   ——余量比决策时假设更宽，决策成立。实测 epoch 折叠 0 次、rerun gate
#   门禁 PASS，目标已达成。**不要改 0（auto）**：会落到 29250（低 5.1×），
