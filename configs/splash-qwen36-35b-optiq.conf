# ============================================================
# Inco Splash 1.4.0 + Qwen3.6-35B-A3B MLX 4bit — MoE（快速日常工作档）
# 用法: ./manage.sh switch splash-qwen36-35b-optiq && ./manage.sh restart
# 模型: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit (20.4GB, 4bit affine/group64) + DFlash2 draft
#   架构: qwen3_5_moe，40 层 = 30 GDN 线性注意力 + 10 全注意力（full_attention_interval=4）
#   稀疏 MoE：35B 总参 / 约 3B 激活 → decode 远快于稠密 27B
# 迁移(2026-10-20): 1.3.1 起 Splash 包(incoai/*-Splash)不再加载(#335 breaking
#   change)，改用 MLX 上游模型。本配置取代 splash-qwen36-35b.conf（旧包已不可用）。
# 预期基线(splash README, M5 Pro):
#   decode 短 prompt 175-210 tok/s / prefill 32K 2011 tok/s / 4 路并发 357 tok/s
#   vs 稠密 Qwen3.8-27B 的 65-71 tok/s → 约 2.5-3×
# 关键参数: --state-format bf16 (35B state 64→34MiB) / --language-only / --persistent-cache
# 适用: 快速日常工作、长散文 agentic；代码重任务可切回 splash-qwen38-27b-mlx。
# 注意: 单模型引擎, 换模型全停重启; 批期禁切换（红线 1）。
#
# ── 2026-10-27 决策依据漂移复核（只记录，不改运行参数）─────────────────
# 背景: PROXY_CTX_EPOCH_TRIGGER_TOKENS=150000 是 2026-10-20 的有意决策
#   （决策出处见 configs/splash-qwen38-27b-mlx.conf L94-101），其安全线基于
#   「prefill 470 tok/s → S=150K 冷启 319s，相对客户端 466s 断连死线留
#   32% 余量」。引擎换代后该基准已变：
#
#   | 指标            | 决策时假设(27B dense) | 本机实测(splash 1.4.0, 35B-A3B) |
#   |-----------------|----------------------|--------------------------------|
#   | prefill         | 470 tok/s            | 1101-1154 tok/s                |
#   | decode          | 65-71 tok/s(27B)     | 116-117 tok/s                  |
#   | S=150000 冷 prefill | ≈319s            | ≈130s（死线 466s → 3.5× 余量）|
#   | DFlash2 接受率  | —                    | 0.534-0.578                    |
#   实测来源: GET http://127.0.0.1:8081/metrics 的
#   splash_prefill_tokens_per_second / splash_decode_tokens_per_second /
#   splash_draft_acceptance_ratio（会话累计口径，2026-10-27 采样）。
#
# 结论: **决策方向正确且余量比当初更大，不应下调阈值。**
#   - 反向校验: 按实测 1154 tok/s，466s 死线留 40% 余量 → S 安全上限
#     ≈ 322,736 tokens，150000 远在其内。
#   - 目标已达成: epoch 折叠实测 0 次（sessions.jsonl 全部真实会话
#     epoch_count=0，rerun gate --max-epoch-collapse 默认 0 的门禁 PASS），
#     即 150000 阈值成功消除了原决策要消除的 epoch_collapse。
#   - **不要**把该值改 0（auto）：auto 公式 min(65% × ctx_chars/4, 70000)
#     在 ctx_chars=180000 下推出 29250，比 150000 低 5.1×，而实测任务
#     上下文 p50=37,336 / p90=60,621 / max=70,795 → 改 0 会让绝大多数
#     会话立刻触发 epoch 折叠，正向摧毁原决策的目标。
#   - auto 公式继承的是旧 ctx_max 假设(§11 三约束推导, ctx_max=400K)，
#     本就不表达"当前 splash 后端最优阈值"——它缺少 prefill 能力这一输入。
#
# 引擎版本漂移(待下次 restart 消解): 本文件头部/CONFIG_DESC 写 "Splash 1.3.2"，
#   实机为 /opt/homebrew/Cellar/splash/1.4.0（1.4.0 起 splash CLI spawn
#   server.py 前端 + serve-native 引擎子进程后自身退出，manage.sh 按端口
#   感知前端 PID）。仅注释与版本号不一致，不影响参数。
# ============================================================

export HF_HUB_OFFLINE=1

LLAMA_BACKEND=splash
LLAMA_MODEL="mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit"
export MODEL_NAME="mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit"
LLAMA_PORT=8081
LLAMA_HOST=127.0.0.1

# 2026-10-21 性能优化（失败会话行为分析 §模式B 实测）：
#   reasoning medium+8192 → low+2048：批期实测单轮 thinking 最高烧 8,418 tok≈60.6s
#   （gen_ms 60,586），45min 墙会话主死因；low+2048 封顶 ≈15s，保底推理。
#   idle-release 10m→120m：批驱动多实例交错下会话轮间闲置实测 57-110min，
#   超 10m 即被释放 → 回来 80-118K 全量重算 5-13s（当日 221 个重算轮根因）。
#   两项均需引擎重启生效（批跑期禁重启，下个空闲窗执行）。
SPLASH_EXTRA_ARGS="--max-context 256K --state-format bf16 --language-only --persistent-cache --default-reasoning-effort low --thinking-token-budget 512 --idle-release 120m"
export SPLASH_EXTRA_ARGS
# 注(2026-10-21): --idle-release 10m 显式声明（引擎默认值亦为 10m）。空闲 10 分钟
#   unwire 内存并释放权重，下一请求 3-5s 重载；只释放权重，不释放 KV/state 缓存。
# 注(2026-10-20): --state-format bf16 — GDN recurrent state 存储减半（35B 64→34MiB/条）。
# 注(2026-10-20): --language-only — 跳过 vision tower，省内存与启动时间。
#   带该参数的模型是独立 installation（首次会重新准备）。
# 注(2026-10-20): --persistent-cache — SSD prefix cache 跨重启保留，避免重启后
#   首个请求全量冷 prefill。生效需 restart（后端启动参数，reload 不生效）。

CONFIG_NAME="Splash + Qwen3.6-35B-A3B OptiQ-4bit (MoE, 混合精度:敏感层8bit)"
CONFIG_DESC="Inco Splash 1.4.0 + Qwen3.6-35B-A3B MLX 4bit MoE(3B激活): state 34MiB/条(bf16), language-only, persistent-cache; 实测(2026-10-27) decode 116-117 tok/s, prefill 1101-1154 tok/s（标称 2011 @32K）"
CONFIG_MEMORY="~21 GB 模型 + KV + state(bf16), language-only（单引擎, 与 Ornith 不可同跑）"
CONFIG_AUTOSTART_AUX="embedgemma2"   # manage.sh start 时随主后端自动拉起（置空关闭）
