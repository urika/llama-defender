# ============================================================
# vllm-mlx + Gemma 4 31B 4bit — 本地量化版（ModelScope 下载）
# 模型: lmstudio-community/gemma-4-31B-it-MLX-4bit (本地路径, ~17GB)
# 特点: 并发2, temp=0.2, CHARS=180K, pin-system-prompt
# ============================================================
# ⚠️ 内存配置已定稿 (2026-08-03 三轮 OOM/实测迭代)，请勿再调：
#   ① 0.75 + cache 8192 + 8bit KV → OOM (性能测试触发, 长 prefill)
#   ② 0.70 + cache 4096 + 8bit KV + 并发2 → OOM (真实 agentic 负载触发:
#      running=2 两请求并发, 17轮对话/5784tok prefill 时 [Memory pressure] 38.8GB)
#   ③ 最终稳定配方 (已实测验证): KV 4-bit + cache 4096 + utilization 0.60 + 并发1
#      实测: 内存 14.1GB, cache 命中改善 49% (TTFT 2590→1316ms), 生成 14.6-16.9 tok/s,
#      无 OOM 无衰减。KV 4-bit 使内存比 8-bit KV 时代降 2.5GB 且速度/缓存收益无损。
#   - dense 31B 每 token KV 开销大, 并发=2 必 OOM; forced cache clear 无法阻止
#   - 如需并行/更多缓存, 换用 MoE 模型 (rapid-mlx-35b-opt) 而非本 dense 模型
#   - suffix-decoding 实测失败 (2026-08-03): 加 --suffix-decoding --suffix-max-draft 4 后
#     生成速度 16→11 tok/s (降速 30%), TTFT 无收益, 已回退。dense 模型 draft 接受率低,
#     verify 开销大于命中收益, 勿再尝试 (35B MoE 移除 force-spec-decode 同理)

export HF_HUB_OFFLINE=1

LLAMA_BACKEND=rapid-mlx
LLAMA_MODEL="/Users/jinsongwang/.cache/modelscope/hub/models/lmstudio-community/gemma-4-31B-it-MLX-4bit"
LLAMA_PORT=8081
LLAMA_HOST=127.0.0.1
LLAMA_THREADS=8

# 采样（低随机，数据处理场景重确定性）
LLAMA_TEMP=0.2
LLAMA_TOP_P=0.5
LLAMA_TOP_K=20
LLAMA_PRESENCE_PENALTY=0.0
LLAMA_MIN_P=0.0
LLAMA_THINKING=false

# Rapid-MLX
RAPID_MLX_TOOL_PARSER="gemma4"
RAPID_MLX_REASONING_PARSER="gemma4"
RAPID_MLX_ENABLE_PREFIX_CACHE=true
RAPID_MLX_KV_QUANTIZATION=true
RAPID_MLX_KV_QUANT_BITS=4
RAPID_MLX_EXTRA_ARGS="--no-mllm --gpu-memory-utilization 0.60 --cache-memory-mb 4096 --max-num-seqs 1 --pin-system-prompt"

# 代理
# dense 31B 并发=2 必 OOM (真实负载验证)，必须 =1
PROXY_MAX_CONCURRENT=1
PROXY_CLEAR_ENABLED=false
PROXY_CLEAR_THRESHOLD=30000
PROXY_TOOL_KEEP=10
PROXY_CTX_LIMIT_ENABLED=true
PROXY_CTX_CHARS_LIMIT=180000
PROXY_CTX_KEEP_HEAD=6
PROXY_CTX_KEEP_TAIL=6
PROXY_BLOCKER_ENABLED=true
PROXY_BLOCKER_THRESHOLD=2
PROXY_CTX_TRUNCATE_STRATEGY=rounds
PROXY_CTX_KEEP_ROUNDS=15
PROXY_MAX_TOKENS_OVERRIDE=32768
PROXY_OUTPUT_TOKEN_LIMIT_RATIO=2.0
PROXY_BACKEND_TIMEOUT=600
PROXY_LOOP_THRESHOLD=3

# 元数据
CONFIG_NAME="vllm-mlx + Gemma-4-31B-4bit (本地量化版)"
CONFIG_DESC="Gemma 4 31B 4bit 本地模型，并发2，Temp 0.2，CHARS 180K，pin-system-prompt"
CONFIG_MEMORY="~14-16 GB"

# 请求体大小硬上限
# local: 500KB (防止 Metal OOM); cloud: 2MB (云服务商自行调度)
PROXY_MAX_REQUEST_BYTES=512000
PROXY_CLOUD_MAX_REQUEST_BYTES=2097152

# === 智能路由：大上下文自动切云端 ===
# OpenCode 优化：提高阈值、关闭 sticky、缩短 cooldown，避免短请求长期锁云。
export PROXY_ROUTE_ENABLED=true
export PROXY_ROUTE_THRESHOLD_CHARS=80000
export PROXY_CLOUD_BASE_URL=https://api.deepseek.com/v1
export PROXY_CLOUD_MODEL=deepseek-v4-flash
export PROXY_ROUTE_CLOUD_CONCURRENT=2
export PROXY_ROUTE_FALLBACK_ENABLED=true
export PROXY_ROUTE_MAX_CLOUD_FAILS=3
export PROXY_ROUTE_CLOUD_COOLDOWN_SECONDS=120
export PROXY_CLOUD_PRICE_INPUT=0.5
export PROXY_CLOUD_PRICE_OUTPUT=1.5
# 关闭 sticky：上下文降到阈值以下后允许回到本地，降低持续 cloud 成本。
export PROXY_ROUTE_STICKY=false
# 如未来重新启用 sticky，建议 3 轮低于 70% 阈值后返回本地。
export PROXY_ROUTE_STICKY_RETURN_ROUNDS=3
export PROXY_ROUTE_STICKY_RETURN_RATIO=0.7
