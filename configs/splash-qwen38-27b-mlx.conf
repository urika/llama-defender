# ============================================================
# Inco Splash 1.3.2 + Qwen3.8-27B MLX 4bit — dense hybrid（备选/代码任务档）
# 用法: ./manage.sh switch splash-qwen38-27b-mlx && ./manage.sh restart
# 模型: mlx-community/Qwen3.8-27B-4bit (15GB, 4bit affine/group64) + DFlash2 draft
# 迁移(2026-10-20): 引擎 1.0.2→1.3.2; 1.3.1 起 Splash 包(incoai/*-Splash)不再加载
#   (#335 breaking change)，改用 MLX 上游模型(同权重)。本配置取代
#   splash-qwen38-27b.conf（后者为旧 Splash 包，1.3.2 已无法加载）。
# 实测(2026-10-20, 本机 M5 Pro 48GB, 1.3.2):
#   冷 prefill 24-33K 450-488 tok/s / 热 TTFT 24K 0.53-0.56s
#   decode 65-71 tok/s / DFlash2 接受率 65.7% / 重启首请求 0.85s(前缀恢复)
#   Metal 19.0GB / headroom 24.2GB / pressure normal
# 关键参数: --state-format bf16 (state 187→81MiB) / --language-only (省 7.4GB)
#           / --persistent-cache (重启保前缀)
# 适用: 代码任务为主(接受率红利) 的场景; 长散文 agentic 选 splash-qwen36-35b 或 ornith。
# 注意: 单模型引擎, 换模型全停重启; 批期禁切换（红线 1）。
# ============================================================

export HF_HUB_OFFLINE=1

LLAMA_BACKEND=splash
LLAMA_MODEL="mlx-community/Qwen3.8-27B-4bit"
export MODEL_NAME="mlx-community/Qwen3.8-27B-4bit"
LLAMA_PORT=8081
LLAMA_HOST=127.0.0.1

SPLASH_EXTRA_ARGS="--max-context 256K --state-format bf16 --language-only --persistent-cache --default-reasoning-effort none --idle-release 10m"
export SPLASH_EXTRA_ARGS
# 注(2026-10-21): --idle-release 10m — 空闲 10 分钟 unwire 内存并释放权重，下一
#   请求 3-5s 重载。10m 是引擎默认值，此处显式声明使配置自解释。只释放**权重**
#   (~15GB)，不释放 KV 页与 GDN state 缓存（state 会随会话数增长，需例行重启治理）。
# 注(2026-09-26): --max-context 100K→256K 原生上限, 对齐 splash-qwen36-35b;
# 27B dense KV 更小, Metal 余量应更宽松, 切换后观察 pressure。生效需 restart
# (后端启动参数, reload 不生效)。
# 注(2026-10-20): --state-format bf16 — GDN recurrent state 存储减半(kernels 仍按
# fp32 计算, 仅在存储点 round 到 bf16)。解 1.0.2 时代 state 触顶(17.4G/95条,
# 41G/43.2G limit, 21 次内存预留被拒, 138s 冷 prefill)。生效需 restart。
# 注(2026-10-20): --language-only — 跳过 vision tower(编码 agent 不需要图片/PDF),
#   省内存与启动时间。带该参数的模型是独立 installation(首次会重新准备)。
# 注(2026-10-20): --persistent-cache — SSD prefix cache 跨重启保留，避免每次
#   重启后首个请求全量冷 prefill(实测重启首请求 83s)。

CONFIG_NAME="Splash 1.3.2 + Qwen3.8-27B MLX 4bit"
CONFIG_DESC="Inco Splash 1.3.2 + Qwen3.8-27B MLX 4bit: state 81MiB/条(bf16), language-only, persistent-cache; 冷 prefill 450-488 tok/s, decode 65-71, 热 TTFT 0.53s"
CONFIG_MEMORY="~15 GB 模型 + KV + state(bf16), language-only（Metal 实测 ~19 GB, 单引擎, 与 Ornith 不可同跑）"
# ============================================================
# 代理上下文管理参数（2026-09-23 自 ornith-oq4e 移植，选项 A）
# 背景: splash conf 原先只有引擎侧参数，代理侧全部回落 CONFIG_REGISTRY
# 默认 → epoch 引擎/视图稳定/PD 微轮召回全关，长会话保护缺失。
# 差异调整: PROXY_DYNAMIC_MAX_TOKENS_RAPID_MLX_RATIO 删（splash 非 rapid-mlx
# 采样路径）；其余与 ornith-oq4e 等值。
# ============================================================
export PROXY_COMPRESS_ENABLED=false              # 上下文工程引擎接管（同 ornith）
export PROXY_TOOL_FILTER_MAX=14
# DEF-313 P1 (2026-10-20): 工具集恒定化。
# Qwen chat template 把 tools 块渲染在 prompt 最前，工具集/顺序任一变化即
# 整条前缀失效（实测 40-70K 上下文 → 30-90s 全量冷 prefill）。此前 auto_promote
# 随会话频率增长 + recent 窗口滑动，几乎每几轮就改写集合，缓存无稳定条目。
# 关闭动态扩充，并按 (session, 客户端工具名集合) 冻结过滤输出——同 profile
# 恒定，不同 profile（受限子 agent）互不污染。
export PROXY_TOOLS_STABLE_SESSION=true
export PROXY_TOOL_AUTO_PROMOTE_THRESHOLD=0
export PROXY_TOOL_FILTER_RECENT=0
# 2026-10-20 内存重估: Metal 18.2G / headroom ~25G / limit 44G（旧 41G / 2.2G 触顶）。
# KV 实测 ~33KB/token → 256K 上下文约 8.4G，完整容纳且余量 >15G。
# 因此上调生命周期阈值，减少过早 clearing（clearing 改写消息 → 击穿前缀缓存）。
#   GROWTH     80000→120000 chars (~30K tok)
#   EXPANSION  250000→400000 (~100K tok)
#   SATURATION 450000→700000 (~175K tok)
#   OOM_DANGER 保持 2000000（~500K tok，高于 256K 上下文 → 不先于硬上限触发）
export PROXY_CHARS_GROWTH=120000
export PROXY_CHARS_EXPANSION=400000
export PROXY_CHARS_SATURATION=700000
export PROXY_CHARS_OOM_DANGER=2000000
export PROXY_OOM_SAFE_CHARS=2000000
export PROXY_OOM_SAFE_TOKENS=600000
# 请求体硬上限 8MB(2026-10-09, 与 splash-qwen36-35b 同步; 防切 conf 丢失——
# R-CM 开关那次同款坑)。入口闸 ≥ 生命周期层折算字节数(2M chars × 3B ≈ 6MB)。
# 热生效: ./manage.sh reload。
export PROXY_MAX_REQUEST_BYTES=8388608
# 2026-10-21 P0: 关闭本地动态并发。
# 依据 AGENTS.md §8.1 硬规则「48GB 上本地并发恒 1（OOM 红线）」。
# 动态并发按 p95 < PROXY_DYNAMIC_CONCURRENT_LATENCY_P95_MS(30s) 放行，但 48K
# 上下文下 12-14s 的 p95 仍被判定为"健康"，于是 1→2→3→4 连升；实测出现
# prefill 与 decode 同时占用 GPU（decode 52.9→23.2 tok/s，冷 48K TTFT 259s）。
# 关闭后回落 PROXY_MAX_CONCURRENT=1；MAX=1 作为将来误开启时的兜底。
export PROXY_MAX_CONCURRENT=1
export PROXY_DYNAMIC_CONCURRENT_ENABLED=false
export PROXY_DYNAMIC_CONCURRENT_MAX=1
export PROXY_DYNAMIC_MAX_TOKENS_SATURATION=8192
export PROXY_DYNAMIC_MAX_TOKENS_OOM=4096
export PROXY_DYNAMIC_MAX_TOKENS_INIT=32768
export PROXY_DYNAMIC_MAX_TOKENS_GROWTH=32768
export PROXY_CTX_ENGINE_ENABLED=true
# 2026-10-20: S 70000→150000。
# 历史依据(docs/02-architecture-design/llama-defender-context-engineering-design.md §11):
#   S=70K 由三约束推导 = min(rapid-mlx pflash 96K 悬崖, 客户端 466s 断连死线@160tok/s≈70K)。
# 现状变化: ① splash 无 pflash 96K 悬崖；② prefill 450-488 tok/s（旧 160-460）；
#   ③ 单轮 prefill 硬上限 466s → 466×0.6×470 ≈ 131K 安全线；取 150K 时最坏
#   冷 prefill ≈ 150K/470 ≈ 319s（留 32% 余量）。KV 150K ≈ 5.0G，headroom 足够。
# 目的: 任务上下文 40-67K 时不再触发 epoch → 消除 epoch_collapse（rerun gate 阈值 0）
#   与 epoch 全量重建的 30-90s 冷 prefill。
export PROXY_CTX_EPOCH_TRIGGER_TOKENS=150000
export PROXY_CTX_WINDOW_K=24
export PROXY_CTX_KEEP_TOKEN_BUDGET=40000
export PROXY_CTX_VIEW_STABLE_ENABLED="true"
export PROXY_ROUTE_ENABLED=true
export PROXY_ROUTE_THRESHOLD_CHARS=80000
export PROXY_ROUTE_STICKY=false
export PROXY_ROUTE_CLOUD_CONCURRENT=2
export PROXY_ROUTE_FALLBACK_ENABLED=true
export PROXY_ROUTE_MAX_CLOUD_FAILS=3
export PROXY_ROUTE_CLOUD_COOLDOWN_SECONDS=300
export PROXY_CLOUD_BASE_URL=https://api.deepseek.com/v1
export PROXY_CLOUD_MODEL=deepseek-flash
export PROXY_CLOUD_PRICE_INPUT=0.5
export PROXY_CLOUD_PRICE_OUTPUT=1.5
export PROXY_CLOUD_CM_ENABLED="false"
export PROXY_PD_MICRO_TURN_ENABLED=true
export PROXY_HBE_ENABLED=false
export PROXY_DIAG_SESSION_TTL_MIN=240
export PROXY_PIN_ENABLED="false"
export PROXY_AUTO_RECALL_ENABLED="true"
# K1 状态摘要 pin(2026-10-10, 分层契约 K1 首实现; reloadable)
export PROXY_TEST_STATE_ENABLED=true
export PROXY_REQUEST_ARCHIVE_ENABLED=true        # br4 录制面(ADR-017): 10-22 换模丢失, 1026-1 提请, 2026-10-26 空窗补行(验收=capability_audit br4→PRESENT)
export PROXY_TOMBSTONE_RECALL_ENABLED="false"
export PROXY_AUX_ISOLATION_STRICT="false"
export PROXY_TOOLS_DENYLIST="mcp__searxng__search,mcp__searxng__fetch,WebFetch,WebSearch"

# L-62 旁白持有（裁决切片, 2026-10-07 激活窗）
export PROXY_PD_MICRO_TURN_HOLD_TEXT=true
# 云端日预算（拍板③, ¥50/天）
export PROXY_ROUTE_DAILY_BUDGET=50

# R-CM-1/R-CM-2 跨会话记忆 + 自动交接（2026-10-08 上线；默认关→开）
export PROXY_MEMORY_ENABLED=true
export PROXY_HANDOFF_ENABLED=true
# L-80 L1 随阶段C切模移植(2026-10-09, regime 锁死两侧一致)
export PROXY_HONEST_METERING=1
