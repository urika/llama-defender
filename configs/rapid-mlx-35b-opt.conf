# ============================================================
# vllm-mlx + Qwen3.6-35B-A3B-UD-MLX-4bit — 优化版
# 改动: 移除 --force-spec-decode + --no-hybrid
#       推理解析器 qwen3, temp=0.7, top_p=0.8
# ============================================================

export HF_HUB_OFFLINE=1

LLAMA_BACKEND=rapid-mlx
LLAMA_MODEL="mlx-community/Qwen3.6-35B-A3B-4bit"
export MODEL_NAME="mlx-community/Qwen3.6-35B-A3B-4bit"  # 代理转发用别名，须与后端 /v1/models id 一致（2026-08-20 切换事故：默认值旧名 404 → local_failure_fallback 送云）
LLAMA_PORT=8081
LLAMA_HOST=127.0.0.1
LLAMA_THREADS=8

# 采样（降低随机性，提升输出一致性）
LLAMA_TEMP=0.7
LLAMA_TOP_P=0.8
LLAMA_TOP_K=20
LLAMA_PRESENCE_PENALTY=0.0
LLAMA_MIN_P=0.0
LLAMA_THINKING=false

# 推理解析器指定 qwen3（正确剥离 <think> 块，输出纯回复）
RAPID_MLX_TOOL_PARSER="qwen3_coder_xml"
RAPID_MLX_REASONING_PARSER="qwen3"
RAPID_MLX_ENABLE_PREFIX_CACHE=true
RAPID_MLX_KV_QUANTIZATION=true
RAPID_MLX_KV_QUANT_BITS=4

# 关键改动：
# 移除 --force-spec-decode（推测解码可能降低质量）
# 移除 --no-hybrid（让模型使用原生 hybrid 注意力）
# repetition-penalty=1.05: 轻微抑制站点名/短语重复（1.1 对代码生成副作用过大，
#   抑制 self/return/import 等正常重复标识符；1.5+ 严重损害代码质量。
#   如需调整，先用 tools/bench_quality.py 验证代码生成质量未退化）
RAPID_MLX_EXTRA_ARGS="--no-mllm --gpu-memory-utilization 0.70 --cache-memory-mb 8192 --max-num-seqs 1 --default-repetition-penalty 1.05 --hybrid-cache-entries 8"

PROXY_MAX_CONCURRENT=1
PROXY_CLEAR_ENABLED=false
PROXY_CLEAR_THRESHOLD=30000
PROXY_TOOL_KEEP=8
PROXY_CTX_LIMIT_ENABLED=true
# 上下文工程引擎开启后提回 400K：生命周期分级/动态 max_tokens 以引擎压缩后的
# canonical 为准（S=60K tokens × ~4 chars ≈ 240K + L0 ≈ 270K；80K 会把健康
# 会话误判 pre_trunc → max_tokens 压到 saturation 档）。引擎开启时 14/17 stage
# 跳过，此值不再触发任何截断。
PROXY_CTX_CHARS_LIMIT=400000
PROXY_CTX_KEEP_HEAD=6
PROXY_CTX_KEEP_TAIL=6
PROXY_CTX_TRUNCATE_STRATEGY=fifo
PROXY_CTX_KEEP_MESSAGES=30
PROXY_MAX_TOKENS_OVERRIDE=32768
PROXY_OUTPUT_TOKEN_LIMIT_RATIO=2.0
PROXY_BACKEND_TIMEOUT=600
PROXY_LOOP_THRESHOLD=3

# === 上下文工程引擎（Phase 1 治理，设计 §4.3/§4.9/§12.4；2026-08-21 启用） ===
# append-only canonical + 写入期压缩 + epoch 状态机。开启时管线 7/14/17 联动跳过、
# OOM 预截断退役（超限走 §4.9 回退保护 413 拒绝，而非静默砍轮失忆）。
export PROXY_CTX_ENGINE_ENABLED=true
# S: epoch 触发预算。2026-08-22 起为**真实 prompt_tokens 口径**（引擎语义
# 变更，见 qwen3.8 conf 校准证据：est 低估 1.6×，est 60K = 真实 ~96K 贴
# pflash 阈值）。65K 真实触发对 35B 同样安全（35B 无 GDN 内存崩溃面，
# epoch 重建 40-65K @~1360 tok/s ≈ 30-50s 不变）。
# 峰值总 payload ≈ S + L0(~8-15K) < pflash 96K 阈值，留安全边际。
export PROXY_CTX_EPOCH_TRIGGER_TOKENS=65000
# K: 不导出 → auto=24 轮原生流（35B 下 epoch 重建 40-70K @~1360 tok/s ≈ 30-50s，
# 满足门禁 2 epoch 轮 P90<60s；466s 客户端死线在 35B 上不再约束，见 §12.4 修正 3）。

CONFIG_NAME="vllm-mlx + Qwen3.6-35B-A3B-UD-MLX-4bit (优化版)"
CONFIG_DESC="35B MoE Unsloth UD-MLX-4bit(动态量化)：移除force-spec-decode+no-hybrid，推理 qwen3 + repetition-penalty 1.05，temp=0.7, GPU=70%"
CONFIG_MEMORY="~14-18 GB"

# 请求体大小硬上限
# local: 2MB——上下文工程开启后客户端 raw 历史每轮全量重发且无界增长
# (~344K chars ≈ 450K+ bytes 已实测), 512KB 会在长会话中段把请求拒之门外;
# Metal OOM 风险由引擎 canonical 视图(≤S=60K tokens)约束, 不再依赖此限。
# cloud: 2MB (云服务商自行调度)
PROXY_MAX_REQUEST_BYTES=2097152
PROXY_CLOUD_MAX_REQUEST_BYTES=2097152

# === 智能路由（可选，默认关闭） ===
# 当上下文超过阈值时自动路由到云端 API
export PROXY_ROUTE_ENABLED=true
export PROXY_ROUTE_THRESHOLD_CHARS=80000
export PROXY_CLOUD_BASE_URL=https://api.deepseek.com/v1
export PROXY_CLOUD_MODEL=deepseek-v4-flash
export PROXY_ROUTE_CLOUD_CONCURRENT=2
export PROXY_ROUTE_FALLBACK_ENABLED=true
export PROXY_ROUTE_MAX_CLOUD_FAILS=3
export PROXY_ROUTE_CLOUD_COOLDOWN_SECONDS=300
export PROXY_CLOUD_PRICE_INPUT=0.5
export PROXY_CLOUD_PRICE_OUTPUT=1.5

# 动态 max_tokens 上限：OpenCode 的 write/edit 等工具调用可能生成较长的 JSON
# 参数/文件内容，init/growth 阶段提高到 32K，避免模型因输出 token 不足而截断 JSON。
export PROXY_DYNAMIC_MAX_TOKENS_INIT=32768
export PROXY_DYNAMIC_MAX_TOKENS_GROWTH=32768
export PROXY_DYNAMIC_MAX_TOKENS_RAPID_MLX_RATIO=1.0

# === 压缩 Profile（可选，默认 balanced） ===
# 用单个变量替代 31+ 个 PROXY_* 参数组合：
#   balanced    — 日常编码，平衡压缩与质量（默认）
#   aggressive  — 超大日志/数据分析，激进压缩省上下文
#   conservative— 质量关键任务，零语义损失风险
# 单个 PROXY_* 环境变量仍可覆盖 profile 中的值。
# export PROXY_COMPRESSION_PROFILE=balanced

# ⚠️ 使用云端路由必须在 configs/secret.local.conf 中配置真实的 PROXY_CLOUD_API_KEY
#   echo 'export PROXY_CLOUD_API_KEY="sk-..."' >> configs/secret.local.conf
# 未配置时路由会自动回退到本地，/status 页面会显示 API Key 未配置。
export PROXY_CTX_ENGINE_ENABLED=true
