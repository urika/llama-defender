# ============================================================
# rapid-mlx + Qwen3.8-27B-4bit — hybrid GatedDeltaNet 版
# 模型: mlx-community/Qwen3.8-27B-4bit (rapid-mlx 别名 qwen3.8-27b-4bit)
# 特点: 27B hybrid(线性注意力 + 每4层全注意力),KV cache 占用小;
#       多模态 checkpoint,默认走纯文本 lane(--no-mllm)
# 注意: 需要 rapid-mlx >= 0.12.13(Qwen3.8 在该版本才 onboard)。
#       brew 渠道滞后(0.12.12),故本配置通过 LLAMA_SERVER_BIN 指向
#       项目内独立 venv 的 0.12.13,不影响其他配置使用 brew 版本。
# ============================================================

export HF_HUB_OFFLINE=1

LLAMA_BACKEND=rapid-mlx
LLAMA_MODEL="mlx-community/Qwen3.8-27B-4bit"
# MODEL_NAME 用于代理层漂移检测、metrics 归因与路由策略，需与后端实际加载的 HF 路径一致
MODEL_NAME="mlx-community/Qwen3.8-27B-4bit"
LLAMA_PORT=8081
LLAMA_HOST=127.0.0.1
LLAMA_THREADS=8

# rapid-mlx 0.12.13(brew 尚在 0.12.12,无 Qwen3.8 支持)
LLAMA_SERVER_BIN="/Users/jinsongwang/APP/llama.cpp/.venv-rapidmlx/bin/rapid-mlx"

# 采样（Qwen3.8 官方非思考模式推荐值,2026-08-15 对齐）
# 注意: 这些 LLAMA_* 变量仅 llama-server 分支使用;rapid-mlx 后端生效的是
# 下方 EXTRA_ARGS 中的 --default-* 旗标,两者保持同值
LLAMA_TEMP=0.7
LLAMA_TOP_P=0.8
LLAMA_TOP_K=20
LLAMA_PRESENCE_PENALTY=1.5
LLAMA_MIN_P=0.0
LLAMA_THINKING=false

# 工具/推理解析器:以 0.12.13 aliases.json 中 qwen3.8-27b-4bit 的官方配置为准
# (工具解析是 hermes,不再是 qwen3_coder_xml;推理解析仍是 qwen3)
RAPID_MLX_TOOL_PARSER="hermes"
RAPID_MLX_REASONING_PARSER="qwen3"
RAPID_MLX_ENABLE_PREFIX_CACHE=true
RAPID_MLX_KV_QUANTIZATION=true
RAPID_MLX_KV_QUANT_BITS=4

# 关键参数：
# 4bit 权重 ~16GB,与 Qwen3.6-27B 同级;hybrid 架构 KV cache 更小,
# 但 prefill 激活峰值仍在,GPU 利用率保持 0.70,并发 1,防止 Metal OOM。
# --no-mllm: 显式走纯文本 lane(视觉需 --mllm,本项目不需要)。
# 采样默认值用 rapid-mlx 的 --default-* 旗标(注意: LLAMA_TEMP/PRESENCE_PENALTY
#   等 LLAMA_* 采样变量只被 llama-server 分支使用,对 rapid-mlx 是死配置,
#   2026-08-15 发现并修正)。取值对齐 Qwen3.8 官方非思考模式推荐:
#   temp 0.7 / top_p 0.8 / top_k 20 / min_p 0.0 / repetition 1.0 / presence 1.5
# --pflash auto: >32K tokens 的长提示启用预填充压缩(A/B 验证后保留,见
#   logs/oom-ladder-*.json;别名尚未 verified,默认跳过工具提示故需 include-tools)
# 2026-08-18 实测(合成集 click-08 重跑逐请求采样):
#   pflash 在 scheduler 侧按设计完全旁路 prefix cache(见 vllm_mlx/pflash.py
#   头部注释),>=32K tokens 后每请求 = 全量压缩重算 prefill,缓存白建。
#   实测: turn2 命中省 29900 tokens 后,连续 25 请求全部 pflash 旁路,共压缩
#   掉 99.3 万 tokens(~4 万/请求,keep_ratio 0.20);代理侧 common_prefix_ratio
#   ~0.9 的"命中率"从未落到后端 KV 复用上。质量代价: 模型每轮只见 sink256
#   + tail2048 + 打分中间块(~20%),"试过X失败"的叙述性中间块权重仅 0.05
#   recency,极易被丢 → 疑似 click-06 马拉松(1205 请求/4h19m)与 L3 失败的
#   促成因素之一。TTFT 构成: <32K 纯 prefill ~150-300 tok/s(冷启动 30K
#   tokens ≈ 103-117s 实测); >=32K pflash 压缩 prefill 整轮 25-45s。
# 决策(2026-08-18): 阈值上移 32768 → 98304 (96K)。32-96K 区间交回前缀
#   缓存: 会话内连续轮次前缀命中,只 prefill 新后缀(实测 7-10s/轮,MTP 关闭
#   后 hits 每轮 +30K tokens);96K+ 才走 pflash 兜底(keep 0.20,轮次 30-60s
#   有界)。代价: 32-96K 区间内若前缀缓存整链被逐出/冷启动,全量纯 prefill
#   100-600s(90K tokens 上限 ~600s 撞 PROXY_BACKEND_TIMEOUT=600,边界),
#   需观察 evictions(cap 4GB,实测批跑 27 次逐出后主链仍存活)。
# --speculative-config(MTP)已关闭(2026-08-17,理由见 docs MTP 实测节):
#   本仓库 agentic 负载是 TTFT/prefill 主导(17K token prefill ≈ 116s,输出多为
#   几十~几百 token 的工具调用),MTP 只加速 decode → 端到端收益≈0;
#   且 27B hybrid(GatedDeltaNet)SSM 缓存只支持单快照回滚,K=2 实际只 draft 1;
#   更致命的是 MTP-vendored 路径在 [metal::malloc] OOM 时无法降级普通解码
#   ("cannot fall back to plain decode because gb._next_tokens is stale"),
#   瞬时内存抖动被放大为整请求失败(18:16-20:53 全部 BrokenPipe 根因)。
#   结论: 27B hybrid + MTP = 收益/风险比差,关闭;待 rapid-mlx 修复降级路径后
#   再在 35B-A3B(纯 transformer,K≥2 生效)上验证。presence penalty 因 MTP
#   移除,目前保持不配(rapid-mlx 死配置区的 LLAMA_PRESENCE_PENALTY 无效)。
# --cache-memory-mb 4096→8192(2026-08-21 断连循环诊断,用户决策):
#   治理后 42355d18 同实例 3.8 重跑出现客户端断连自持循环:请求 ~63.4K tokens
#   时 canonical rebuild 打冷缓存→冷 prefill 需 ~5.75 分钟(adaptive_prefill
#   chunk 2048→512→256 降级,Metal active 22GB/peak 28.8GB/cap 28.1GB)→超过
#   客户端 ~5 分钟流停滞耐心→3×499 断开重试。后端实测 cache_mem=3970MB:
#   3 条 × ~63.4K tokens 条目(~1.32GB/条)恰把 4096 预算顶满→每次请求
#   prefix-pressure-evict 互相逐出→重试永远 cache_fetch MISS 全量冷 prefill。
#   35B 不受影响(per-token KV 更小,3 条不触顶)。8192 让 3-6 条共存不逐出,
#   重试可命中缓存断环。
#   风险: Metal 峰值已 28.8GB > cap 28.1GB(软上限),加预算后 prefill 期峰值
#   可能更高——重启后盯 llama-server.log 的 metal OOM;降级路径 = 回 4096 +
#   改引擎 epoch 触发按真实 tokens(est 低估 1.8× 已在 llama-defender 待办)。
RAPID_MLX_EXTRA_ARGS="--no-mllm --gpu-memory-utilization 0.80 --cache-memory-mb 8192 --max-num-seqs 1 --default-temperature 0.7 --default-top-p 0.8 --default-top-k 20 --default-min-p 0.0 --default-repetition-penalty 1.0 --pflash auto --pflash-threshold 98304 --pflash-include-tools --hybrid-cache-entries 8"

PROXY_MAX_CONCURRENT=1
# 压缩策略: aggressive（2026-08-22 切换）。PROXY_COMPRESSION_PROFILE 对硬编码默认键无效,
# 故显式覆盖以下未设置的键以生效。PROXY_CLEAR_ENABLED 保持 false（本地后端避免 Wasted call
# 循环,见 AGENTS.md §8.4）;PROXY_CACHE_ALIGN_HEAD 不降到 2 以保住 prefix cache 命中率。
PROXY_COMPRESSION_PROFILE=aggressive
PROXY_COMPRESS_MODE=aggressive
PROXY_COMPRESS_THRESHOLD=2048
PROXY_TOOL_FILTER_MAX=15
PROXY_DEDUPE_SCALARS=true
# 恢复压缩审计(aggressive 预设默认关),恢复对改写的可观测性,验证语义安全
PROXY_COMPRESS_AUDIT=true
PROXY_CLEAR_ENABLED=false
PROXY_CLEAR_THRESHOLD=30000
PROXY_TOOL_KEEP=8
PROXY_CTX_LIMIT_ENABLED=true
# 400K chars ≈ 100K tokens;PFlash 下冷 TTFT ~63s(实测),hybrid KV 无 OOM 风险
PROXY_CTX_CHARS_LIMIT=400000
# 生命周期边界同步上移:否则 ≥90K chars 会落入 saturation 阶段,
# 被 SmartRouter Priority 8 (lifecycle_stage) 路由到云端,400K 上限形同虚设
PROXY_CHARS_EXPANSION=400000
PROXY_CHARS_OOM_DANGER=450000
PROXY_CTX_KEEP_HEAD=6
PROXY_CTX_KEEP_TAIL=6
PROXY_CTX_TRUNCATE_STRATEGY=fifo
PROXY_CTX_KEEP_MESSAGES=80
PROXY_MAX_TOKENS_OVERRIDE=32768
PROXY_OUTPUT_TOKEN_LIMIT_RATIO=2.0
# 600→900（2026-08-18 冒烟任务 2 实测）: 344K chars(~80K tokens)冷 prefill 撞
# 600s 上限(代理侧语义压缩每轮改写历史→前缀缓存 hits 仅 40/368→每轮全量
# 冷 prefill);900s 给长 prefill 更大余量。scope: reloadable,manage.sh reload
# 生效。上限拉长也会放大无解 run 的空转时长,批跑配 --max-turns 150 对冲。
PROXY_BACKEND_TIMEOUT=900
# 循环阈值 3->2（2026-08-22）: 让 LEVEL1 干预在连续 2 次相同工具调用即触发,
# 更早打断搜索循环(serper 连续 5 次)。注意: 2 较敏感,可能误伤合法连续调用。
PROXY_LOOP_THRESHOLD=2

# === 上下文工程引擎（Phase 1 治理，设计 §4.3/§4.9/§12.4；2026-08-21 启用） ===
# append-only canonical + 写入期压缩 + epoch 状态机。开启时管线 7/14/17 联动跳过、
# OOM 预截断退役（超限走 §4.9 回退保护 413 拒绝，而非静默砍轮失忆）。
# 2026-08-21 切回 3.8 时从 35B conf 对齐（35B 门禁 #39 独立修法未过隐藏测试，
# 用户决策切回 3.8 重试同实例——引擎开关必须与后端解耦，两 conf 同 regime）。
export PROXY_CTX_ENGINE_ENABLED=false
# S: epoch 触发预算。2026-08-22 起为**真实 prompt_tokens 口径**（校准证据：
# 42355d18 重跑后端实测 prompt=82346 vs 引擎 est=51248，est 低估 1.6×——
# 旧 60K est 口径 = 真实 ~96K 恰贴 pflash 阈值，系统在真实 82K 已内存崩溃，
# 触发点形同虚设）。65K 真实触发：收编产物 ~41K（K=24 估算），留 ~24K
# 增长余量（约 7-10 轮）；真实 82K 崩溃点与 pflash 96K 均在触发线之上。
# 65K→40K（2026-08-22 第五次断连后，与 K=12 配套，待 reload 生效）：
# ① S 本身降不了过冲峰值（触发滞后一轮，见 K 注释），但 S<当前 last_real
#   （41.6K）使 reload 后下一次重试立即触发重收编——用 K=12 产品（~31.5K，
#   prefill ~110-135s）立刻脱离 41.6K/~175s 的断连重试循环，无需等硬币落地；
# ② 40K 与 K=12 产物 31.5K 间留 ~8.5K 增长余量，epoch 节奏 ~3-5 轮/次。
# 切回 35B 如需同 regime，同步此值（35B prefill 快 4.6×，无此边际问题，
# 35B conf 保持 65000）。
export PROXY_CTX_EPOCH_TRIGGER_TOKENS=40000
# K: 24→12（2026-08-22 第五次断连后止血，与 S=40K 配套，待 reload 生效）:
# auto=24 实测产物 41.6K real——冷 prefill ~175-240s（chunk 1024→512→256 降级，
# ~234 tok/s 有效速率），恰与客户端重试零字节耐心（stream=False 重试实测
# 断于 168s/178s/240s，正常轮 ~300s）同量级 → 每个 epoch 都是断连硬币
# （产物尝试 3 断 2，余 1 落地于 175s 边际）。产物 = 基础区 ~21.5K（LCP
# 实测共享头部）+ K 轮 ×~840 real tokens。K=12 → 产物 ~31.5K → prefill
# ~110-135s，正常轮与重试轮双重边际恢复。代价: epoch 后窗口 24→12 轮
# （agent 对 24 轮仍在 git 考古未收敛，质量风险已接受）。过冲峰值上限同步
# 下移 ~10K（产物 + 单轮增长），82K 崩溃面暴露缩小但未消除——根治待
# maybe_epoch 触发判定加 max(est×R) 项（代码改动，需 restart，留待本 run
# 结束，见 swe-eval 任务 #50）。
export PROXY_CTX_WINDOW_K=12

CONFIG_NAME="rapid-mlx 0.12.13 + Qwen3.8-27B-4bit"
CONFIG_DESC="Qwen3.8 27B hybrid(GatedDeltaNet) 4-bit,hermes 工具解析,GPU=70%,Tool Clearing OFF"
CONFIG_MEMORY="~15-18 GB"

# 请求体大小硬上限
# local: 1.5MB = 400K chars 中文 × 3B/char (ensure_ascii=False 后) + 工具/开销余量;
# cloud: 2MB (云服务商自行调度)。注意 export: 非 manage.sh 渠道裸启动代理时
# 未 export 的变量不会进入进程环境 (2026-08-15 曾因此回落 512K 默认值触发 413)
export PROXY_MAX_REQUEST_BYTES=1572864
export PROXY_CLOUD_MAX_REQUEST_BYTES=2097152

# === 智能路由（可选，默认关闭） ===
# 当上下文超过阈值时自动路由到云端 API
export PROXY_ROUTE_ENABLED=true
# 200K chars ≈ 39K tokens:本地直用 PFlash 区(>170K chars 即触发,TTFT ~30-45s),
# 跳过 80-160K chars 的"全量 prefill 死亡区间"(TTFT 53-105s)交给云端。
# CTX_CHARS_LIMIT 保持 400K 作云端故障时的本地兜底上限。
# 观察项: PFlash 压缩工具提示在真实代码任务上的质量(变差则下调至 60K 或调高 pflash-threshold)
export PROXY_ROUTE_THRESHOLD_CHARS=200000
export PROXY_CLOUD_BASE_URL=https://api.deepseek.com/v1
export PROXY_CLOUD_MODEL=deepseek-v4-flash
export PROXY_ROUTE_CLOUD_CONCURRENT=2
export PROXY_ROUTE_FALLBACK_ENABLED=true
export PROXY_ROUTE_MAX_CLOUD_FAILS=3
export PROXY_ROUTE_CLOUD_COOLDOWN_SECONDS=300
export PROXY_CLOUD_PRICE_INPUT=0.5
export PROXY_CLOUD_PRICE_OUTPUT=1.5

# === 请求优先级队列（灰度，2026-08-15 起开启） ===
# 大请求入队按 bucket 排序，interactive <16K chars 优先，防止大 prefill 阻塞小请求。
# huge(>=200K chars) 与 PROXY_ROUTE_THRESHOLD_CHARS 对齐：直接强制走云端，
# 客户端显式 X-Proxy-Route-To: local 时返回 413，不静默违背用户意图。
export PROXY_QUEUE_ENABLED=true
export PROXY_QUEUE_TIMEOUT_SECONDS=300
export PROXY_QUEUE_LARGE_THRESHOLD_CHARS=80000
export PROXY_QUEUE_HUGE_THRESHOLD_CHARS=200000
export PROXY_QUEUE_HUGE_ACTION=cloud

# OOM 预截断阈值（2026-08-18 冒烟批跑发现）：请求全量历史 >200K chars 时按
# keep_rounds=2 砍到最近 2 轮，模型静默失忆（swe38-in 会话 11:47 起每轮被截）。
# 350K 试运行后仍不够：客户端(Claude Code)自己的压缩阈值 ~400K 高于 350K，
# OOM 截断总在客户端重置前先咬（350-400K 带）。450K 让客户端压缩先触发
# （payload 重置、OOM 永不触发，墙成纯双保险）；压缩后 ~85-90K tokens 仍在
# pflash 96K token 阈值与 600s 后端超时内。PROXY_CTX_CHARS_LIMIT=400K 的
# fifo 层为更上层兜底。
export PROXY_OOM_SAFE_CHARS=450000

# 动态 max_tokens 上限：OpenCode 的 write/edit 等工具调用可能生成较长的 JSON
# 参数/文件内容，init/growth 阶段提高到 32K，避免模型因输出 token 不足而截断 JSON。
export PROXY_DYNAMIC_MAX_TOKENS_INIT=32768
export PROXY_DYNAMIC_MAX_TOKENS_GROWTH=32768
export PROXY_DYNAMIC_MAX_TOKENS_RAPID_MLX_RATIO=1.0

# === 压缩 Profile（可选，默认 balanced） ===
# export PROXY_COMPRESSION_PROFILE=balanced

# ⚠️ 首次使用前需先下载模型(~16GB,需临时关闭 HF_HUB_OFFLINE):
#   HF_HUB_OFFLINE=0 .venv-rapidmlx/bin/rapid-mlx chat qwen3.8-27b-4bit
# 或: HF_HUB_OFFLINE=0 .venv-rapidmlx/bin/huggingface-cli download mlx-community/Qwen3.8-27B-4bit
#
# ⚠️ 使用云端路由必须在 configs/secret.local.conf 中配置真实的 PROXY_CLOUD_API_KEY
#   echo 'export PROXY_CLOUD_API_KEY="sk-..."' >> configs/secret.local.conf
# 未配置时路由会自动回退到本地，/status 页面会显示 API Key 未配置。
