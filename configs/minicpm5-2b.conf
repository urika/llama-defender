# ============================================================
# rapid-mlx + MiniCPM5-2B-MLX-4bit — 轻量辅助引擎（独立启停）
# 端口 8082 独立于生产(8081 Ornith-35B)与 9B(8084)。
# 用 ./manage.sh start-aux minicpm5-2b 启停，与主后端共存、互不影响。
# 模型: OpenBMB MiniCPM5-2B (dense Llama 架构 2.5B, 4bit 1.35GB, 131K ctx)
# 本地路径: ~/models/MiniCPM5-2B-MLX-4bit (无 MTP 层; DSpark drafter 仅 SGLang 支持)
# ============================================================

export HF_HUB_OFFLINE=1

LLAMA_BACKEND=rapid-mlx
LLAMA_MODEL="$HOME/models/MiniCPM5-2B-MLX-4bit"
export MODEL_NAME="$HOME/models/MiniCPM5-2B-MLX-4bit"
LLAMA_PORT=8082
LLAMA_HOST=127.0.0.1

# 2B 4bit 权重仅 1.35GB: gpu-mem 0.15 (48GB → cap ~7.2GB) 绰绰有余,
# 且对主引擎(25GB 驻留)友好; 与 9B 档一致单并发, 避免 Metal 争抢放大。
RAPID_MLX_EXTRA_ARGS="--no-mllm --gpu-memory-utilization 0.15 --cache-memory-mb 1024 --max-num-seqs 1"
RAPID_MLX_ENABLE_PREFIX_CACHE=true

# 2B 模型内存充裕, 不开 KV 量化(保持质量)
RAPID_MLX_KV_QUANTIZATION=false

# MiniCPM5 默认输出 <think> 块: qwen3 推理解析器可剥离; thinking 关闭由
# _start_rapid_mlx 依据 LLAMA_THINKING 注入 --no-thinking。
RAPID_MLX_REASONING_PARSER="qwen3"

# 注意: MiniCPM5 工具调用格式与 qwen3_coder_xml 并非严格对齐, 轻量
# 对话/问答场景无碍; 如需承载 agentic 工具调用, 先实测解析准确性。
RAPID_MLX_TOOL_PARSER="qwen3_coder_xml"

CONFIG_NAME="rapid-mlx + MiniCPM5-2B-MLX-4bit (aux)"
CONFIG_DESC="MiniCPM5-2B(1.35GB 4bit): 轻量辅助引擎, 独立 8082, start-aux/stop-aux 独立启停, 与主后端共存"
CONFIG_MEMORY="~2 GB cap"
