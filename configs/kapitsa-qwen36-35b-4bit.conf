# ============================================================
# Kapitsa + Qwen3.6-35B-A3B-4bit（MTP + KFlash 投机解码）
# 2026-10-29 接入：速度优先档（比 splash+OptiQ 快 15-25%，质量 -1.6pp）
# 详见 docs/05-operations-changelog/flint-kapitsa-evaluation-20261029.md §六
# ============================================================
CONFIG_NAME="Kapitsa + Qwen3.6-35B-A3B-4bit (MTP+KFlash)"
CONFIG_DESC="Kapitsa 0.2.24 + mlx-community/Qwen3.6-35B-A3B-4bit + DFlash2 草稿器 + MTPLX MTP head：KFlash 树验证叠加 MTP 级联投机 → 纯 decode 148-150 tok/s（splash+OptiQ 为 116-132），质量门 91.9%（4bit 上限；生产 OptiQ 93.5%）。速度优先档；模型目录须含 dflash2/ 与 mtp.safetensors（来源 Youssofal/Qwen3.6-35B-A3B-MTPLX-Optimized-Speed，见评估文档 §六）"
CONFIG_MEMORY="~22 GB（权重 19.5 + DFlash2 1.0 + MTP 0.58 + KV/state）；单主引擎，与 splash 互斥"

# 后端类型（manage.sh 新增 kapitsa 分支）
LLAMA_BACKEND=kapitsa

# Kapitsa 模型名（= ~/.cache/kapitsa/models/<name>，含权重/草稿器/MTP 侧车）
KAPITSA_MODEL="qwen3.6-35b-a3b-4bit"
KAPITSA_BIN="kapitsa"
KAPITSA_CTX=262144
# slots=1：代理侧 PROXY_MAX_CONCURRENT=1 已串行（批驱动也单实例交错），
# slots>1 只是把 KV room 按槽位预留（4 槽实测 20.7GB / 1 槽 ~7.3GB），白占内存无并发收益。
# 需要并发直连时应改为 2 并同步放宽代理并发（48GB 内存下不推荐）。
KAPITSA_SLOTS=1
# 额外参数（空格分隔），常用：
#   --dflash none            关草稿器（纯 MTP 对照）
#   --context 65536          收小上下文释放 KV room
#   --mem-budget 20          限制 GPU 内存
KAPITSA_EXTRA_ARGS=""

# 对外暴露（代理侧按此名路由；kapitsa 默认忽略 model 字段，加 --allow-switch 才认）
MODEL_NAME="qwen3.6-35b-a3b-4bit"
LLAMA_HOST="127.0.0.1"
LLAMA_PORT=8081

# 采样（Kapitsa 用模型自带默认；如需覆盖可在 KAPITSA_EXTRA_ARGS 追加）
LLAMA_TEMP=1.0
