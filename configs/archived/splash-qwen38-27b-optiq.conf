# ============================================================
# Splash 1.4.0 + Qwen3.8-27B OptiQ-4bit — 混合精度质量档（A/B 试验）
# 用法: ./manage.sh switch splash-qwen38-27b-optiq && ./manage.sh restart
# 模型: mlx-community/Qwen3.8-27B-OptiQ-4bit (19.0GB) + incoai/Qwen3.8-27B-DFlash2
#
# 与 splash-qwen38-27b-mlx（均匀 4-bit）的关系:
#   同一底座 Qwen3.8-27B，只换量化布局，用于隔离 A/B 量化变量。
#   均匀 4-bit: 全部 498 张量 W4, group 64, 15GB, ~4.44 bpw, 零 per-layer 覆盖
#   OptiQ     : 261 层 W8 + 237 层 W4, group 64, 19.0GB, ~5.63 bpw (+27%)
#   校准: KL 散度敏感度 × 六域混合（prose/reasoning/code/agent/tool-call/constraint）
#   视觉塔 bf16 sidecar 0.9GB；--language-only 下不加载
#
# 加载测试（2026-10-21，Splash 1.4.0，8091 隔离端口，256K）:
#   weights loaded 4.86s; /v1/models context 262144; KV int8; vision disabled
#   ANE FFN split 自动启用: share 0.47（256K 内存计划）, 校准 10.4s,
#     2048 行 FFN 层 29.2ms vs GPU-only 46.9ms
#   工具调用通过: get_weather({"city":"Beijing"}), finish_reason=tool_calls
#   prefill 534.9 tok/s @4.5K / 540.5 @7.3K
#   decode 71.3 tok/s（tool-call，28 draft/22 accepted）
#          27.8 tok/s（代码段落，280 draft/64 accepted）— 接受率随内容波动
#   内存 actual 22.5GB / peak 23.1GB / pressure normal
#   能力上限不变（SWE-Pro 61.7 / TB2.1 73.0）；收益是低比特失真减少
#
# 因此本档直接定 256K（与基线同窗口），不再经过 128K 初测。
#
# A/B 结果（2026-10-21，16 项筛查套件，两臂同为 256K，temp=0）:
#   通过率        16/16 vs 16/16（均匀 4-bit vs OptiQ）
#   decode 中位   34.2 vs 26.9 tok/s；tool 34.2 vs 26.9；code 38.8 vs 30.5
#   prefill 中位  166.3 vs 161.8 tok/s
#   Metal peak    21.3 vs 25.6 GB
#   ANE           均匀档全程 split；OptiQ 的 split 在运行中因
#                 59.5ms/层 > GPU 46.9ms 自动停止（需重启才能重试）
#   结论: 未达到 "B ≥ A+2" 门槛，且更慢、更占内存 → 不作为默认质量档；
#         保留为备用，仅在确认均匀 4-bit 存在量化退化时再启用。
#
# 注意: 单模型引擎，换模型全停重启；批期禁切换（红线 1）。
# ============================================================

export HF_HUB_OFFLINE=1

LLAMA_BACKEND=splash
LLAMA_MODEL="mlx-community/Qwen3.8-27B-OptiQ-4bit"
export MODEL_NAME="mlx-community/Qwen3.8-27B-OptiQ-4bit"
LLAMA_PORT=8081
LLAMA_HOST=127.0.0.1

SPLASH_EXTRA_ARGS="--max-context 256K --state-format bf16 --language-only --persistent-cache --default-reasoning-effort none --idle-release 10m"
export SPLASH_EXTRA_ARGS
# 注: --idle-release 10m — 空闲 10 分钟释放权重（19GB），下一请求 3-5s 重载；
#   不释放 KV 页与 GDN state 缓存。
# 注: --state-format bf16 — GDN recurrent state 存储减半（kernels 仍 fp32 计算）。
# 注: --language-only — 跳过 OptiQ 的 bf16 视觉塔，省 0.9GB 与启动时间。
# 注: --persistent-cache — SSD prefix cache 跨重启保留。
# 注: 256K 已实测（22.5GB/peak 23.1GB）；不要加 --disable-ane——dense 27B 默认启用 ANE FFN split。

CONFIG_NAME="Splash 1.4.0 + Qwen3.8-27B OptiQ-4bit"
CONFIG_DESC="Qwen3.8-27B OptiQ-4bit(19.0GB, 261层8bit+237层4bit): 256K 实测档; ANE split 0.47, prefill 535 tok/s @4.5K, decode 28-71 tok/s(接受率相关); Metal 22.5GB"
CONFIG_MEMORY="~22.5 GB @256K（19.0 权重 + int8 KV + state/激活）, peak 23.1 GB"

# ============================================================
# 代理上下文管理参数：引擎/采样与 splash-qwen38-27b-mlx 对齐；
# 上下文预算按 256K 定档（基线 conf 默认 400K chars，做长上下文 A/B
# 时需把基线也对齐到 900000，否则比较的是上下文管理而非量化）。
# ============================================================
export PROXY_COMPRESS_ENABLED=false
export PROXY_TOOL_FILTER_MAX=14
# DEF-313 P1: 工具集恒定化，防止 tools 块改写击穿前缀缓存
export PROXY_TOOLS_STABLE_SESSION=true
export PROXY_TOOL_AUTO_PROMOTE_THRESHOLD=0
export PROXY_TOOL_FILTER_RECENT=0

# 256K tokens ≈ 900K chars（3.5 chars/token）；生命周期阈值全部高于该上限
export PROXY_CTX_CHARS_LIMIT=900000
export PROXY_CHARS_GROWTH=250000
export PROXY_CHARS_EXPANSION=600000
export PROXY_CHARS_SATURATION=1200000
export PROXY_CHARS_OOM_DANGER=3200000
export PROXY_OOM_SAFE_CHARS=3200000
export PROXY_OOM_SAFE_TOKENS=600000
export PROXY_MAX_REQUEST_BYTES=8388608

# 48GB 本地并发恒 1（AGENTS.md §8.1 红线）
export PROXY_MAX_CONCURRENT=1
export PROXY_DYNAMIC_CONCURRENT_ENABLED=false
export PROXY_DYNAMIC_CONCURRENT_MAX=1
export PROXY_DYNAMIC_MAX_TOKENS_SATURATION=8192
export PROXY_DYNAMIC_MAX_TOKENS_OOM=4096
export PROXY_DYNAMIC_MAX_TOKENS_INIT=32768
export PROXY_DYNAMIC_MAX_TOKENS_GROWTH=32768

export PROXY_CTX_ENGINE_ENABLED=true
# S=300K > 256K 上限 → 本档不做 epoch 折叠，只保留引擎的视图稳定能力
export PROXY_CTX_EPOCH_TRIGGER_TOKENS=300000
export PROXY_CTX_WINDOW_K=24
export PROXY_CTX_KEEP_TOKEN_BUDGET=40000
export PROXY_CTX_VIEW_STABLE_ENABLED="true"

export PROXY_ROUTE_ENABLED=true
export PROXY_ROUTE_THRESHOLD_CHARS=80000
export PROXY_ROUTE_STICKY=false
export PROXY_ROUTE_CLOUD_CONCURRENT=2
export PROXY_ROUTE_FALLBACK_ENABLED=true
export PROXY_ROUTE_MAX_CLOUD_FAILS=3
export PROXY_ROUTE_CLOUD_COOLDOWN_SECONDS=300
export PROXY_CLOUD_BASE_URL=https://api.deepseek.com/v1
export PROXY_CLOUD_MODEL=deepseek-flash
export PROXY_CLOUD_PRICE_INPUT=0.5
export PROXY_CLOUD_PRICE_OUTPUT=1.5
export PROXY_CLOUD_CM_ENABLED="false"
export PROXY_PD_MICRO_TURN_ENABLED=true
export PROXY_HBE_ENABLED=false
export PROXY_DIAG_SESSION_TTL_MIN=240
export PROXY_PIN_ENABLED="false"
export PROXY_AUTO_RECALL_ENABLED="true"
export PROXY_TEST_STATE_ENABLED=true
export PROXY_TOMBSTONE_RECALL_ENABLED="false"
export PROXY_AUX_ISOLATION_STRICT="false"
export PROXY_TOOLS_DENYLIST="mcp__searxng__search,mcp__searxng__fetch,WebFetch,WebSearch"
export PROXY_PD_MICRO_TURN_HOLD_TEXT=true
export PROXY_ROUTE_DAILY_BUDGET=50
export PROXY_MEMORY_ENABLED=true
export PROXY_HANDOFF_ENABLED=true
export PROXY_HONEST_METERING=1

# ============================================================
# 下载与启用
# 1) 下载权重（约 19GB，已完成 2026-10-21）:
#    huggingface-cli download mlx-community/Qwen3.8-27B-OptiQ-4bit
# 2) 切换前确认当前无批跑（红线 1）:
#    ./manage.sh status
# 3) 切换:
#    ./manage.sh switch splash-qwen38-27b-optiq && ./manage.sh restart
#
# 加载测试已完成（2026-10-21，8091 隔离端口）:
#   a. ✅ Splash 1.4.0 加载 OptiQ 混合量化（mlx-affine, 498 层覆盖）
#   b. ✅ /v1/models context 262144, text-only; 工具调用通过
#   c. ✅ ANE FFN split 0.47, 校准 10.4s, 无 rerun
#   d. ✅ prefill 534.9 tok/s @4.5K; decode 71.3/27.8 tok/s（接受率相关）
#   e. ✅ Metal actual 22.5GB / peak 23.1GB / pressure normal
#
# 仍需生产 A/B（与 splash-qwen38-27b-mlx 对照，缺一即回退）:
#   1. 10 个仓库任务通过率 ≥ 基线 +2 分，或工具调用格式错误明显下降；
#   2. 长上下文 A/B 时两侧 PROXY_CTX_CHARS_LIMIT 对齐（900000 或都用 400000）；
#   3. 连续 3 轮 40K+ 会话，prefix 命中 ≥90%，Metal 峰值 ≤25GB。
# ============================================================
