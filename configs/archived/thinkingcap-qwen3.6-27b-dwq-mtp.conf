# ============================================================
# ThinkingCap Qwen3.6-27B DWQ-MTP — 归档配置（保留等上游）
# 模型: /Users/jinsongwang/APP/llama.cpp/models/ThinkingCap-Qwen3.6-27B-oQ4e-DWQ-MTP-Vision-MLX
#        (本地 16GB, 含内嵌 MTP 头 model-mtp.safetensors + Vision model-vision.safetensors)
# 来源: 用户指定下载, 2026-08-03 wget + hf-mirror 镜像
# 状态: ⚠️ 归档于 2026-08-03 — 待 rapid-mlx 支持内嵌 MTP 后恢复
# ============================================================
# 📌 测试结论 (rapid-mlx 0.11.5, 2026-08-03):
#   ✅ DWQ 量化解析正常: 16.2GB 权重全部加载 (0.6.71 下张量错位输出乱码,
#      0.11.5 修复)。基础推理 / 代码生成 / 工具调用均正常。
#   ❌ MTP 不可用: qwen3_5 家族 MTP 注入强制要求外部 mtp_sidecar
#      (如 mlx-community/Qwen3.5-9B-MTP-4bit)，拒绝使用 checkpoint 内嵌的
#      model-mtp.safetensors → --speculative-config 启动硬失败 (RuntimeError)。
#      属上游兼容 gap, 非模型问题。等待 upstream issue / 新版修复。
#   🔧 手动启动 (0.11.5, 无 MTP 可用, 端口避开 8081):
#       rapid-mlx serve <LLAMA_MODEL> --host 127.0.0.1 --port 8082 \
#         --no-mllm --gpu-memory-utilization 0.60
#   🔧 MTP 若上游修复后 (当前会硬失败):
#       rapid-mlx serve <LLAMA_MODEL> --host 127.0.0.1 --port 8082 \
#         --no-mllm --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
#   💾 内存: on-disk 15.9GB, est. working set 23.8GB — 与 gemma 同跑时约 95% 利用率, 慎并发

export HF_HUB_OFFLINE=1

LLAMA_BACKEND=rapid-mlx
LLAMA_MODEL="/Users/jinsongwang/APP/llama.cpp/models/ThinkingCap-Qwen3.6-27B-oQ4e-DWQ-MTP-Vision-MLX"
LLAMA_PORT=8082
LLAMA_HOST=127.0.0.1
LLAMA_THREADS=8

# 采样
LLAMA_TEMP=0.6
LLAMA_TOP_P=0.9
LLAMA_TOP_K=20
LLAMA_THINKING=false

# Rapid-MLX (0.11.5 CLI: --enable-mtp 已移除, 改用 --speculative-config)
RAPID_MLX_TOOL_PARSER="qwen3_coder_xml"
RAPID_MLX_REASONING_PARSER="qwen3"
RAPID_MLX_ENABLE_PREFIX_CACHE=true
RAPID_MLX_EXTRA_ARGS="--no-mllm --gpu-memory-utilization 0.60"

# 代理
PROXY_MAX_CONCURRENT=1
PROXY_CLEAR_ENABLED=false
PROXY_CTX_LIMIT_ENABLED=true
PROXY_CTX_CHARS_LIMIT=120000

# 元数据
CONFIG_NAME="ThinkingCap-Qwen3.6-27B DWQ-MTP (归档/等上游)"
CONFIG_DESC="DWQ 量化 27B 编码模型, 内嵌 MTP; rapid-mlx 0.11.5 下 MTP 不可用(需外部 sidecar), 保留等上游"
CONFIG_MEMORY="~16-24 GB"
