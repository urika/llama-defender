# ============================================================
# 星火 Spark-X2.5-4B 官方 GGUF + llama-server
# 模型: XHToken/Spark-X2.5-4B-GGUF (Apache 2.0, 1M 上下文)
# 注意: llama.cpp 主线尚未合并 spark2_5 架构支持,
#       当前需使用 PR #27868 构建的 llama-server。
#       brew 版 llama.cpp (build 1 / d4c8e2c) 会报
#       "unknown model architecture: 'spark2_5'" 而无法加载。
# ============================================================

export HF_HUB_OFFLINE=1

LLAMA_BACKEND=llama-server
LLAMA_MODEL="/Users/jinsongwang/APP/llama.cpp/models/Spark-X2.5-4B.gguf"
export MODEL_NAME="/Users/jinsongwang/APP/llama.cpp/models/Spark-X2.5-4B.gguf"
LLAMA_PORT=8082
LLAMA_HOST=127.0.0.1
LLAMA_THREADS=8

# LLAMA_CTX/BATCH/UBATCH/N_PREDICT/KV_K/KV_V 使用 manage.sh 默认值:
#   LLAMA_CTX=131072, LLAMA_BATCH=2048, LLAMA_UBATCH=512,
#   LLAMA_N_PREDICT=-1, LLAMA_KV_K=q8_0, LLAMA_KV_V=q8_0
# 4B 模型很小, 默认量化/上下文已足够; 如需调整请在此显式覆盖。

# 采样
LLAMA_TEMP=0.7
LLAMA_TOP_P=0.95
LLAMA_TOP_K=20
LLAMA_PRESENCE_PENALTY=0.0
LLAMA_MIN_P=0.0

# Spark-X2.5 是 thinking 模型, 强制开启 <think>
LLAMA_THINKING=true

# 代理侧: 4B 无 OOM 风险, 工具调用由 llama-server 自带解析
PROXY_MAX_CONCURRENT=2
PROXY_TOOL_FILTER_ENABLED=false
PROXY_CLEAR_ENABLED=false

CONFIG_NAME="spark-x2.5-llama-server"
CONFIG_DESC="星火 Spark-X2.5-4B 官方 GGUF + llama-server (thinking 模型, prefix cache 友好)"
CONFIG_MEMORY="8"
