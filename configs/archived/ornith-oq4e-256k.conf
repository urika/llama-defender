# ============================================================
# ornith-oq4e-256k.conf — 非交互批处理档 (256K tokens)
# 更新: 2026-10-21 修正为 rapid-mlx 0.14.3 可执行版本
#
# 设计依据: docs/02-architecture-design/context-tier-profiles-design-20260901.md §4.3
# 语义: 256K tokens 物理窗口 + 禁头截断(keep=512 事实不触发) + 原文寄存
#       首轮冷 prefill 7-11min(非交互可容忍), 之后暖轮仅付增量(10-30s)
#
# KV 账(2026-10-21 按模型 config 重算, 取代文档旧外推):
#   40 层 = 30 linear_attention + 10 full_attention
#   num_key_value_heads=2, head_dim=256
#   每 token = 2(K,V) x 10 层 x 2 头 x 256 = 10,240 元素
#   bf16 20KiB/token -> 256K = 5.0 GiB
#   int8 ~10.5KiB/token -> 2.6 GiB; int4 ~5.4KiB/token -> 1.35 GiB
#   GDN recurrent state 固定 ~34 MiB/序列, 不随上下文增长
#   预算: 20.1(权重) + 5.0(KV) + 0.03(state) + 2~3(激活/保留) = ~27-28 GB
#
# 引擎能力(0.14.3, 2026-09-23 实测):
#   - 静态 safelist 虽未列 qwen3_5_moe, 但运行期探针在 hybrid 上 fail-closed:
#     KVCacheQuantizationUnsupportedError(ArraysCache)
#   - 结论: 0.14.3 上 KV 量化不可用, bf16 是唯一路径
#   - 256K bf16 KV = 5.0GiB, 已在预算内, 不需要量化
#
# 切换: ./manage.sh switch ornith-oq4e-256k && ./manage.sh start-backend && ./manage.sh restart
# 校准: 文末验收清单全部通过后再用于生产负载
# ============================================================

export HF_HUB_OFFLINE=1

LLAMA_BACKEND=rapid-mlx
LLAMA_MODEL="pyros-vault/Ornith-1.5-35B-A3B-oQ4e-fixed-mtp"
export MODEL_NAME="pyros-vault/Ornith-1.5-35B-A3B-oQ4e-fixed-mtp"
LLAMA_PORT=8081
LLAMA_HOST=127.0.0.1
LLAMA_SERVER_BIN="/Users/jinsongwang/APP/llama.cpp/.venv-rapidmlx-0143/bin/rapid-mlx"
LLAMA_THREADS=8

# 采样（Ornith 官方推荐通用参数: temp=0.6, top_p=0.95, top_k=20）
LLAMA_TEMP=0.6
LLAMA_TOP_P=0.95
LLAMA_TOP_K=20
LLAMA_PRESENCE_PENALTY=0.0
LLAMA_MIN_P=0.0
LLAMA_THINKING=false

RAPID_MLX_TOOL_PARSER="qwen3_coder_xml"
RAPID_MLX_REASONING_PARSER="qwen3"
RAPID_MLX_ENABLE_PREFIX_CACHE=true
# 0.14.3 对 hybrid 的 KV 量化 fail-closed(实测), 必须保持 false。
# 256K bf16 KV = 5.0GiB, 已在预算内; 要 int8 只能等引擎支持或换引擎。
RAPID_MLX_KV_QUANTIZATION=false
RAPID_MLX_KV_QUANT_BITS=8

# cache-memory-mb 是多 entry 容器上限, 不是单会话 KV 预算。
# 12800/16384 已有实测反例(12288 -> 248 次 Metal 压力驱逐; 16G 试过回退)。
# hybrid 前缀缓存必配 --hybrid-cache-entries 8; --pin-system-prompt 保前缀稳定。
RAPID_MLX_EXTRA_ARGS="--no-mllm --gpu-memory-utilization 0.80 --cache-memory-mb 8192 --max-num-seqs 1 --default-repetition-penalty 1.0 --hybrid-cache-entries 8 --pin-system-prompt"

CONFIG_NAME="rapid-mlx + Ornith-1.5-35B-A3B-oQ4e 256K batch"
CONFIG_DESC="Ornith-oQ4e 非交互 256K 档: 禁头截断+bf16 KV(5.0GiB@256K)+原文寄存; 首轮冷 prefill 7-11min, 暖轮仅增量; 批处理/长文档专用"
CONFIG_MEMORY="~27-28 GB(权重 20.1 + KV 5.0 + state 0.03 + 激活/保留); int8 KV 可降至 ~25 GB"

# ---- 上下文预算: 256K tokens ≈ 900K chars ----
PROXY_CTX_LIMIT_ENABLED=true
PROXY_CTX_CHARS_LIMIT=900000
PROXY_CTX_TRUNCATE_STRATEGY=fifo
# keep=512 = 事实禁头截断; 超出 900K chars 走 ctx_recall 分页协议
PROXY_CTX_KEEP_MESSAGES=512
PROXY_CTX_KEEP_HEAD=6
PROXY_CTX_KEEP_TAIL=6

# ---- 请求体积: 900K chars 在中文下可达 ~2.7MB ----
PROXY_MAX_REQUEST_BYTES=4194304
PROXY_CLOUD_MAX_REQUEST_BYTES=4194304

# ---- 生命周期: SATURATION 必须高于 900K ctx 上限, 否则在 ~128K tokens 提前降档 ----
export PROXY_CHARS_GROWTH=250000
export PROXY_CHARS_EXPANSION=600000
export PROXY_CHARS_SATURATION=1200000
export PROXY_CHARS_OOM_DANGER=3200000
export PROXY_OOM_SAFE_CHARS=3200000
# 必须显式抬高: 注册表默认 60000 会在估算 token >60K 时硬砍到 head+tail 12 条
export PROXY_OOM_SAFE_TOKENS=600000

# ---- 本地后端护栏 ----
# tool_result 清除默认 local=true, 会触发 rapid-mlx Wasted call 死循环并击穿前缀
export PROXY_CLEAR_ENABLED=false
PROXY_CLEAR_THRESHOLD=30000
export PROXY_COMPRESS_ENABLED=false
PROXY_TOOL_KEEP=8
export PROXY_TOOL_FILTER_MAX=14
PROXY_MAX_CONCURRENT=1
PROXY_QUEUE_ENABLED=true

# ---- 前缀稳定性: 本档"暖轮只付增量"的前提 ----
export PROXY_CTX_VIEW_STABLE_ENABLED="true"
# 本档要求完整 256K 物理窗口, 不做 epoch 折叠
export PROXY_CTX_ENGINE_ENABLED=false
export PROXY_AUTO_RECALL_ENABLED="false"
export PROXY_TOMBSTONE_RECALL_ENABLED="false"

# ---- 输出预算: 非交互可放宽 ----
export PROXY_DYNAMIC_MAX_TOKENS_INIT=32768
export PROXY_DYNAMIC_MAX_TOKENS_GROWTH=32768
export PROXY_DYNAMIC_MAX_TOKENS_SATURATION=8192
export PROXY_DYNAMIC_MAX_TOKENS_OOM=4096
PROXY_MAX_TOKENS_OVERRIDE=0
PROXY_OUTPUT_TOKEN_LIMIT_RATIO=2.0

# ---- 超时: 覆盖 256K 冷 prefill ----
PROXY_BACKEND_TIMEOUT=1200
# 7: Claude Code 多步 Bash 序列实测 max_run=6, 阈值 3 会误报
PROXY_LOOP_THRESHOLD=7

# ---- 批处理不走云端(避免长文档外发) ----
export PROXY_ROUTE_ENABLED=false

# ---- PDC: 超过 900K chars 后走召回协议, 而非无感丢弃 ----
PROXY_PD_ENABLED=true
PROXY_PD_MICRO_TURN_ENABLED=true
PROXY_TRUNCATE_REPLAYABLE_DROP=true

# ============================================================
# 启用前验收(缺一不可)
# 1. bash -n configs/ornith-oq4e-256k.conf
#    ./manage.sh config-lint configs/ornith-oq4e-256k.conf
# 2. 单请求打到 256K, 读 /metrics 的 cache bytes ÷ tokens;
#    bf16 应 ≈20KiB/token, 偏差 >20% 先停下查
# 3. ./manage.sh monitor 2 观察 Metal 峰值 ≤32.5GB, 无持续 memory_pressure 拒绝
# 4. 256K 冷 prefill 7-11min; 暖轮增量 10-30s, 前缀命中 ≥90%
# 5. 若切 int8: 先跑 scripts/kv_quant_quality_gate.py,
#    greedy agreement ≥97% 才允许上生产
# ============================================================
