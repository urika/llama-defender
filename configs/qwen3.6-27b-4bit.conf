# ============================================================
# vllm-mlx + Qwen3.6-27B-4bit — dense 版
# 模型: mlx-community/Qwen3.6-27B-4bit
# 特点: 27B dense，4-bit KV，参考 rapid-mlx-35b-opt 优化参数
# 注意: 非 MoE，全参数激活，上下文和并发需保守
# ============================================================

export HF_HUB_OFFLINE=1

LLAMA_BACKEND=rapid-mlx
LLAMA_MODEL="mlx-community/Qwen3.6-27B-4bit"
LLAMA_PORT=8081
LLAMA_HOST=127.0.0.1
LLAMA_THREADS=8

# 采样（降低随机性，提升输出一致性）
LLAMA_TEMP=0.7
LLAMA_TOP_P=0.8
LLAMA_TOP_K=20
LLAMA_PRESENCE_PENALTY=0.0
LLAMA_MIN_P=0.0
LLAMA_THINKING=false

# 推理解析器指定 qwen3（正确剥离 <think> 块，输出纯回复）
RAPID_MLX_TOOL_PARSER="qwen3_coder_xml"
RAPID_MLX_REASONING_PARSER="qwen3"
RAPID_MLX_ENABLE_PREFIX_CACHE=true
RAPID_MLX_KV_QUANTIZATION=true
RAPID_MLX_KV_QUANT_BITS=4

# 关键参数：
# 27B dense 全参数激活，比 35B MoE(3B active) 峰值显存压力更高，
# GPU 利用率保持 0.70，并发 1，防止 Metal OOM。
# repetition-penalty=1.05: 轻微抑制站点名/短语重复（1.1 对代码生成副作用过大）
RAPID_MLX_EXTRA_ARGS="--no-mllm --gpu-memory-utilization 0.70 --cache-memory-mb 4096 --max-num-seqs 1 --default-repetition-penalty 1.05"

PROXY_MAX_CONCURRENT=1
PROXY_CLEAR_ENABLED=false
PROXY_CLEAR_THRESHOLD=30000
PROXY_TOOL_KEEP=8
PROXY_CTX_LIMIT_ENABLED=true
PROXY_CTX_CHARS_LIMIT=80000
PROXY_CTX_KEEP_HEAD=6
PROXY_CTX_KEEP_TAIL=6
PROXY_CTX_TRUNCATE_STRATEGY=fifo
PROXY_CTX_KEEP_MESSAGES=30
PROXY_MAX_TOKENS_OVERRIDE=32768
PROXY_OUTPUT_TOKEN_LIMIT_RATIO=2.0
PROXY_BACKEND_TIMEOUT=600
PROXY_LOOP_THRESHOLD=3

CONFIG_NAME="vllm-mlx + Qwen3.6-27B-4bit"
CONFIG_DESC="Qwen3.6 27B dense 4-bit，参考 35B-A3B 优化版，GPU=70%，Tool Clearing OFF"
CONFIG_MEMORY="~13-16 GB"

# 请求体大小硬上限
# local: 500KB (防止 Metal OOM); cloud: 2MB (云服务商自行调度)
PROXY_MAX_REQUEST_BYTES=512000
PROXY_CLOUD_MAX_REQUEST_BYTES=2097152

# === 智能路由（可选，默认关闭） ===
# 当上下文超过阈值时自动路由到云端 API
export PROXY_ROUTE_ENABLED=true
export PROXY_ROUTE_THRESHOLD_CHARS=80000
export PROXY_CLOUD_BASE_URL=https://api.deepseek.com/v1
export PROXY_CLOUD_MODEL=deepseek-v4-flash
export PROXY_ROUTE_CLOUD_CONCURRENT=2
export PROXY_ROUTE_FALLBACK_ENABLED=true
export PROXY_ROUTE_MAX_CLOUD_FAILS=3
export PROXY_ROUTE_CLOUD_COOLDOWN_SECONDS=300
export PROXY_CLOUD_PRICE_INPUT=0.5
export PROXY_CLOUD_PRICE_OUTPUT=1.5

# 动态 max_tokens 上限：OpenCode 的 write/edit 等工具调用可能生成较长的 JSON
# 参数/文件内容，init/growth 阶段提高到 32K，避免模型因输出 token 不足而截断 JSON。
export PROXY_DYNAMIC_MAX_TOKENS_INIT=32768
export PROXY_DYNAMIC_MAX_TOKENS_GROWTH=32768
export PROXY_DYNAMIC_MAX_TOKENS_RAPID_MLX_RATIO=1.0

# === 压缩 Profile（可选，默认 balanced） ===
# export PROXY_COMPRESSION_PROFILE=balanced

# ⚠️ 使用云端路由必须在 configs/secret.local.conf 中配置真实的 PROXY_CLOUD_API_KEY
#   echo 'export PROXY_CLOUD_API_KEY="sk-..."' >> configs/secret.local.conf
# 未配置时路由会自动回退到本地，/status 页面会显示 API Key 未配置。
