# ============================================================
# dflash-mlx + Qwen3.6-35B-A3B-4bit — DFlash 投机解码版
# 模型: mlx-community/Qwen3.6-35B-A3B-4bit + z-lab/Qwen3.6-35B-A3B-DFlash
# 特点: DFlash 块扩散投机解码, decode ~117 tok/s(thinking off, 实测),
#       prefix cache + L2 快照默认开启, 工具调用 OpenAI 格式
# 注意: 需要 .venv-dflash (python3.12 -m venv + pip install dflash-mlx)
#       drafter config 已补顶层 block_size/rope_theta 补丁(2026-08-26)
# ============================================================

export HF_HUB_OFFLINE=1

LLAMA_BACKEND=dflash-mlx
LLAMA_MODEL="mlx-community/Qwen3.6-35B-A3B-4bit"
export MODEL_NAME="mlx-community/Qwen3.6-35B-A3B-4bit"  # 代理转发用别名，须与后端 /v1/models id 一致
LLAMA_PORT=8081
LLAMA_HOST=127.0.0.1
LLAMA_THREADS=8

# dflash-mlx 二进制（独立 venv）
DFLASH_BIN="./.venv-dflash/bin/dflash"

# DFlash 草稿模型（投机解码）
DFLASH_DRAFT_MODEL="z-lab/Qwen3.6-35B-A3B-DFlash"

# Thinking 默认关闭（与本地后端一致; 开启会吞输出、降 decode）
DFLASH_ENABLE_THINKING=false

# 采样（对齐 Qwen 官方非思考模式推荐, 见 rapid-mlx 35B MoE 对照）
# repetition-penalty 1.05 轻微抑制重复
DFLASH_EXTRA_ARGS="--temp 0.7 --top-p 0.8 --top-k 20 --min-p 0.0"

PROXY_MAX_CONCURRENT=1
PROXY_CLEAR_ENABLED=false
PROXY_CLEAR_THRESHOLD=30000
PROXY_TOOL_KEEP=8
PROXY_CTX_LIMIT_ENABLED=true
PROXY_CTX_CHARS_LIMIT=400000
PROXY_CTX_KEEP_HEAD=6
PROXY_CTX_KEEP_TAIL=6
PROXY_CTX_TRUNCATE_STRATEGY=fifo
PROXY_CTX_KEEP_MESSAGES=30
PROXY_MAX_TOKENS_OVERRIDE=32768
PROXY_OUTPUT_TOKEN_LIMIT_RATIO=2.0
PROXY_BACKEND_TIMEOUT=600
PROXY_LOOP_THRESHOLD=3

# 上下文工程引擎关闭（默认）：dflash 自带 prefix cache + L2 快照，
# 依赖稳定前缀；引擎 epoch 重写会破坏前缀缓存命中（与 qwen3.8 同理）。
export PROXY_CTX_ENGINE_ENABLED=false

CONFIG_NAME="dflash-mlx + Qwen3.6-35B-A3B-4bit (DFlash)"
CONFIG_DESC="dflash-mlx DFlash 投机解码: 35B-A3B-4bit + z-lab DFlash, decode ~117 tok/s, thinking off"
CONFIG_MEMORY="~20 GB"

# 请求体大小硬上限
PROXY_MAX_REQUEST_BYTES=2097152
PROXY_CLOUD_MAX_REQUEST_BYTES=2097152

# === 智能路由（可选，默认关闭） ===
export PROXY_ROUTE_ENABLED=true
export PROXY_ROUTE_THRESHOLD_CHARS=80000
export PROXY_CLOUD_BASE_URL=https://api.deepseek.com/v1
export PROXY_CLOUD_MODEL=deepseek-v4-flash
export PROXY_ROUTE_CLOUD_CONCURRENT=2
export PROXY_ROUTE_FALLBACK_ENABLED=true
export PROXY_ROUTE_MAX_CLOUD_FAILS=3
export PROXY_ROUTE_CLOUD_COOLDOWN_SECONDS=300
export PROXY_CLOUD_PRICE_INPUT=0.5
export PROXY_CLOUD_PRICE_OUTPUT=1.5

# 动态 max_tokens 上限
export PROXY_DYNAMIC_MAX_TOKENS_INIT=32768
export PROXY_DYNAMIC_MAX_TOKENS_GROWTH=32768
export PROXY_DYNAMIC_MAX_TOKENS_RAPID_MLX_RATIO=1.0