# ============================================================
# ornith-oq4e-256k.conf — 非交互批处理档(256K tokens, 2026-09-01)
#
# 设计依据: docs/02-architecture-design/context-tier-profiles-design-20260901.md §4.3
# 语义: 256K tokens 物理窗口 + 禁头截断(keep=512 事实不触发) + 原文寄存
# ——等效可访问容量 = 会话累计全量; 首轮冷 prefill ~8-10min(非交互可容忍),
#    之后每轮仅增量(10-30s)。前缀破碎计数(prefix_breaks)应恒为 0。
#
# 切换: ./manage.sh switch ornith-oq4e-256k && ./manage.sh start-backend && ./manage.sh restart
# 依赖: KV cache 实测校准(文档 §6 门禁)通过后再用于生产负载
# ============================================================

CONFIG_NAME="rapid-mlx + Ornith-1.5-35B-A3B-oQ4e 256K batch"
CONFIG_DESC="Ornith-oQ4e 非交互 256K 档: 禁头截断(keep=512)+大 KV(12800MB 起步,校准后上探 16384)+原文寄存; 首轮冷 prefill 8-10min 可容忍, 暖轮 10-30s; 批处理/长文档专用"
CONFIG_MEMORY="~24-28 GB(权重 20.1 + KV 12-16 + 激活/保留)"

# ---- 上下文预算: 256K tokens ≈ 900K chars(3.5 chars/token 实测校准) ----
PROXY_CTX_LIMIT_ENABLED=true
PROXY_CTX_CHARS_LIMIT=900000
PROXY_CTX_TRUNCATE_STRATEGY=fifo
# keep=512 = 事实禁头截断(200 轮 agent 会话 ≈ 600 条消息, 超出走
# ctx_recall 分页协议而非无感丢弃——L1 指引已就位)
PROXY_CTX_KEEP_MESSAGES=512
PROXY_CTX_KEEP_HEAD=6
PROXY_CTX_KEEP_TAIL=6

# ---- 请求体积: 900KB 文本 + 结构开销 ----
PROXY_MAX_REQUEST_BYTES=1200000

# ---- OOM 墙退为纯兜底(batch 档前缀稳定, 不走激进分支) ----
export PROXY_CHARS_GROWTH=80000
export PROXY_CHARS_EXPANSION=250000
export PROXY_CHARS_SATURATION=450000
export PROXY_CHARS_OOM_DANGER=3200000
export PROXY_OOM_SAFE_CHARS=3200000

# ---- 超时: 覆盖首轮 8-10min 冷 prefill(客户端链路需同步放宽) ----
PROXY_BACKEND_TIMEOUT=1200

# ---- 引擎: 大 KV 空间(cache-memory-mb 校准后可上探 16384) ----
LLAMA_MODEL="pyros-vault/Ornith-1.5-35B-A3B-oQ4e-fixed-mtp"
export MODEL_NAME="pyros-vault/Ornith-1.5-35B-A3B-oQ4e-fixed-mtp"
LLAMA_BASE_URL="http://127.0.0.1:8081/v1"
LLAMA_PORT=8081
export RAPID_MLX_TOOL_PARSER=qwen3_coder_xml
export RAPID_MLX_REASONING_PARSER=qwen3
export RAPID_MLX_KV_QUANTIZATION=true
export RAPID_MLX_KV_QUANT_BITS=4
export RAPID_MLX_EXTRA_ARGS="--no-mllm --gpu-memory-utilization 0.80 --cache-memory-mb 12800 --max-num-seqs 1 --default-repetition-penalty 1.0 --hybrid-cache-entries 8"
# hybrid GDN 前缀缓存必配(--hybrid-cache-entries 8); KV 4bit 下 256K tokens
# 约需 12-16GB, 12800MB 先按 196K 校准

# ---- PDC: 折叠仍兜底, 全部带指引/可恢复 ----
PROXY_PD_ENABLED=true
PROXY_PD_MICRO_TURN_ENABLED=true
PROXY_TRUNCATE_REPLAYABLE_DROP=true

# ---- 输出预算: 非交互可放宽(默认 2048 太紧) ----
PROXY_DYNAMIC_MAX_TOKENS_SATURATION=4096
