export HF_HUB_OFFLINE=1
LLAMA_BACKEND=rapid-mlx
LLAMA_MODEL="mlx-community/Qwen3-8B-4bit"
LLAMA_PORT=8081
LLAMA_HOST=127.0.0.1
LLAMA_THREADS=8
LLAMA_TEMP=0.6
LLAMA_TOP_P=0.95
LLAMA_TOP_K=20
LLAMA_THINKING=false
RAPID_MLX_TOOL_PARSER="qwen3_coder"
RAPID_MLX_REASONING_PARSER="qwen3"
RAPID_MLX_ENABLE_PREFIX_CACHE=true
RAPID_MLX_KV_QUANTIZATION=false
RAPID_MLX_EXTRA_ARGS="--no-mllm --gpu-memory-utilization 0.40 --cache-memory-mb 1024 --max-num-seqs 4"
PROXY_MAX_CONCURRENT=4
PROXY_CLEAR_ENABLED=false
PROXY_TOOL_KEEP=8
PROXY_CTX_LIMIT_ENABLED=true
PROXY_CTX_CHARS_LIMIT=80000
PROXY_CTX_TRUNCATE_STRATEGY=fifo
PROXY_MAX_TOKENS_OVERRIDE=32768
PROXY_BACKEND_TIMEOUT=600
CONFIG_NAME="vllm-mlx + Qwen3-8B"
CONFIG_DESC="Qwen3-8B，最小模型，并发4，测试用"
CONFIG_MEMORY="~4-5 GB"

# 请求体大小硬上限
# local: 500KB (防止 Metal OOM); cloud: 2MB (云服务商自行调度)
PROXY_MAX_REQUEST_BYTES=512000
PROXY_CLOUD_MAX_REQUEST_BYTES=2097152

# === 智能路由 ===
PROXY_ROUTE_ENABLED=true
PROXY_ROUTE_THRESHOLD_CHARS=90000
PROXY_CLOUD_BASE_URL=https://api.deepseek.com/v1
PROXY_CLOUD_MODEL=deepseek-v4-flash
PROXY_ROUTE_CLOUD_CONCURRENT=2
PROXY_ROUTE_FALLBACK_ENABLED=true
PROXY_ROUTE_MAX_CLOUD_FAILS=3
PROXY_ROUTE_CLOUD_COOLDOWN_SECONDS=1800
PROXY_CLOUD_PRICE_INPUT=0.5
PROXY_CLOUD_PRICE_OUTPUT=1.5
PROXY_ROUTE_DAILY_BUDGET=5.0

# ⚠️ 使用云端路由必须在 configs/secret.local.conf 中配置真实的 PROXY_CLOUD_API_KEY
#   echo 'export PROXY_CLOUD_API_KEY="sk-..."' >> configs/secret.local.conf
# 未配置时路由会自动回退到本地，/status 页面会显示 API Key 未配置。
